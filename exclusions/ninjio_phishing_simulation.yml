name: "NINJIO phishing simulation"
description: "Identifies phishing simulations sent by NINJIO and excludes the message from live analysis."
type: "exclusion"
source: |
  type.inbound
  and any(headers.ips,
          .ip in (
            "168.245.68.235",
            "69.72.33.74",
            "198.244.55.48",
            "159.135.230.133",
            "159.135.235.211",
            "161.38.196.112",
            "69.72.46.85"
          )
  )
  and sender.email.domain.root_domain in (
    "securegateway-access.com",
    "secure-scores.co",
    "secure-paymentlink-auth.com",
    "passlink-secure.com",
    "net-link-secure.com",
    "mypasschange.com",
    "mycartcheck-out.com",
    "media-sharer.com",
    "ez-sendfile.net",
    "encryptiaportal.net",
    "drive-signin.org",
    "csatsafety-training.org",
    "cybersecurityawarenesstraining.com",
    "myportalonline.org",
    "approvalworkspace.com",
    "profileactivity.com",
    "sheetreview.com",
    "corporate-forms.com",
    "documentflow.io",
    "projectworksuite.com",
    "technology-services.net",
    "credential-update.me"
  )
