name: "Attachment: PDF Object Hash - Generic MSFT lure"
description: "Detects inbound emails containing PDF attachments where the PDF object hash matches a specific known object hash previously associated with generic Microsoft lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              .scan.pdf_obj_hash.object_hash == "fc52ac1737c442a200c7392061766221"
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
id: "95cf65b0-7a41-522b-890b-3dcf38a0daea"
og_id: "11d517b4-5d86-5367-a44c-61faf1db12db"
testing_pr: 5517
testing_sha: 8451560772d55bc9bdc4e50ec6f93f2349afa9d3