name: "PR# 5517 - Attachment: PDF Object Hash - Generic MSFT lure"
description: "Detects inbound emails containing PDF attachments where the PDF object hash matches a specific known object hash previously associated with generic Microsoft lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              .scan.pdf_obj_hash.object_hash == "fc52ac1737c442a200c7392061766221"
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
id: "95cf65b0-7a41-522b-890b-3dcf38a0daea"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5517