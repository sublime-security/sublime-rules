name: "Open redirect: Toradex"
description: "Detects inbound emails containing links that exploit an open redirect vulnerability on toradex.com's /service/share endpoint. The rule identifies links with both 'target' and 'url' query parameters present, which triggers the redirect, while excluding legitimate cases where the destination URL itself points back to toradex.com."
type: "rule"
severity: "medium"
source: |
   type.inbound
   and any(body.links,
           .href_url.domain.root_domain == "toradex.com"
           and strings.icontains(.href_url.path, '/service/share')
           // the redirect only fires when both params are present
           and regex.icontains(.href_url.query_params, '(?:^|&)target=')
           and regex.icontains(.href_url.query_params, '(?:^|&)url=')
           // negate use of the redirect by toradex
           and not regex.icontains(.href_url.query_params,
                                   '(?:^|&)url=[^&]*toradex\.com'
           )
   )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Open redirect"
detection_methods:
  - "URL analysis"
