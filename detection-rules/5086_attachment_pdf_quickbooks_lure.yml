name: "Attachment: QuickBooks PDF lure"
description: "Detects inbound messages containing PDF attachments that match YARA signatures identifying QuickBooks-themed lure content."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "quickbooks_pdf_payment_lure")
          )
  )
attack_types:
  - "BEC/Fraud"
  - "Malware/Ransomware"
tactics_and_techniques:
  - "PDF"
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "d56c7296-8090-5661-84db-5525dde0814d"
og_id: "392ffc56-14b1-587a-91ae-55ed852d55ec"
testing_pr: 5086
testing_sha: 6fee6cd818a9569e41f9c61b0dc6a4318ea985af