name: "PR# 5086 - Attachment: QuickBooks PDF lure"
description: "Detects inbound messages containing PDF attachments that match YARA signatures identifying QuickBooks-themed lure content."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "quickbooks_pdf_payment_lure")
          )
  )
attack_types:
  - "BEC/Fraud"
  - "Malware/Ransomware"
tactics_and_techniques:
  - "PDF"
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "d56c7296-8090-5661-84db-5525dde0814d"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5086