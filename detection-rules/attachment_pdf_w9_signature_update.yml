name: "Attachment: PDF W9 signature update lure"
description: "Detects inbound messages containing PDF attachments that match YARA signatures associated with W9 tax form lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
      any(file.explode(.),
          any(.scan.yara.matches,
              .name == "pdf_w9_signatures_update"
          )
      )
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "YARA"
  - "File analysis"
