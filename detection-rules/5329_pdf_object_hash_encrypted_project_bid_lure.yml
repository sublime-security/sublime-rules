name: "Attachment: PDF Object Hash - Encrypted PDF with proposal bid lure"
description: "Detects inbound emails containing PDF attachments whose embedded objects match known malicious object hashes observed in encrypted PDFs with a bid proposal."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              .scan.pdf_obj_hash.object_hash in (
                "c515d2cb8f93b87bc4891a411ab37e6d",
                "a67f29d92dd43a924218dc6a437c13d6"
              )
          )
  )
attack_types:
  - "Malware/Ransomware"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
  - "Threat intelligence"
id: "390bcb22-1bab-5ae8-a219-3438220297e4"
og_id: "93572816-27f2-5d36-9388-da090a7635bc"
testing_pr: 5329
testing_sha: c9af174ded7ba2cd1663d6d7cd0cf79c6439991e