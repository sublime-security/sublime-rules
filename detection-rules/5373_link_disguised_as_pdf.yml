name: "Link: Disguised as PDF file"
description: "Detects inbound messages containing a link in the thread body whose display text ends in '.pdf', where recipient domains are valid and the sender's domain is not among trusted senders."
type: "rule"
severity: "low"
source: |
  type.inbound
  and all(recipients.to, .email.domain.valid == true)
  and sender.email.domain.root_domain not in $high_trust_sender_root_domains
  and any(body.current_thread.links, strings.iends_with(.display_text, '.pdf'))
tags:
  - "Attack surface reduction"
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Content analysis"
  - "Sender analysis"
