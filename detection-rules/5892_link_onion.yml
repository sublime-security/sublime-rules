name: "PR# 5892 - Link: .onion From Unsolicited Sender"
description: "Detects messages containing .onion (Tor network) links from unsolicited senders that either lack proper DMARC authentication or are not from trusted domains."
type: "rule"
severity: "low"
source: |
  type.inbound
  and (
    any(body.links, .href_url.domain.tld == "onion")
    or regex.icontains(body.current_thread.text, '\b[a-z2-7]{56}\.onion\b')
  )
  and not profile.by_sender_email().solicited
  // negate highly trusted sender domains unless they fail DMARC authentication
  and not (
    sender.email.domain.root_domain in $high_trust_sender_root_domains
    and coalesce(headers.auth_summary.dmarc.pass, false)
  )
tags:
  - "Attack surface reduction"
