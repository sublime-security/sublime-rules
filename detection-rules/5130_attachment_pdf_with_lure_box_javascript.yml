name: "PR# 5130 - Attachment: PDF with embedded box-lure and javascript"
description: "Detects inbound messages containing a PDF attachment that matches YARA signatures looking for JavaScript functions or specific lure boxes that have been observed within malicious documents."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches,
                  .name in ("pdf_js_function_box_lure", "pdf_rect_size_box_lure")
              )
          )
  )
attack_types:
  - "Credential Phishing"
  - "Malware/Ransomware"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
  - "Evasion"
detection_methods:
  - "File analysis"
  - "YARA"
id: "14890afd-d810-5af7-938e-66ebc317c434"
tags:
  - created_from_open_prs
  - rule_status_renamed
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5130