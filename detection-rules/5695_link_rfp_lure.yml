name: "PR# 5695 - Link: RFP/RFQ lure"
description: "Flags inbound messages containing a thread with fewer than five links where at least one link's display text begins with 'RFP' or 'RFQ', a common lure used to disguise malicious links as legitimate business procurement requests."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and length(body.current_thread.links) < 4
  and any(body.current_thread.links,
          strings.starts_with(.display_text, "RFP", "RFQ")
          and length(.display_text) > 3
  )
tags:
  - "Attack surface reduction"
  - pr_author_keaton-sublime
  - created_from_open_prs
  - rule_status_added
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "URL analysis"
  - "Content analysis"
id: "bad69273-577e-5a43-b75a-3c3fc98f564d"
references:
  - https://github.com/sublime-security/sublime-rules/pull/5695