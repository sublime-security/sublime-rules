name: "Link: Fake video link from newly registered domain"
description: "Detects inbound messages from a sender whose domain was registered less than 30 days ago, containing a link with a path resembling a video file URL structure ('.mp4/views/')."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and network.whois(sender.email.domain).days_old < 30
  and any(body.current_thread.links,
          strings.contains(.href_url.path, ".mp4/views/")
  )
attack_types:
  - "Malware/Ransomware"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Whois"
  - "URL analysis"
  - "Sender analysis"
id: "7588bce9-faac-58e5-bcfc-82f6a9fb2892"
og_id: "dc1f5d72-233b-5c20-8573-bdebf23552ce"
