name: "Body: Tox messenger ID"
description: "Detects messages containing a Tox messenger ID. This tactic is commonly used by extortionists and ransomware operators to move communication outside of email to an anonymous, untraceable channel."
type: "rule"
severity: "low"
source: |
  type.inbound
  and regex.icontains(body.current_thread.text, '\bq?tox\b')
  and regex.contains(body.current_thread.text, '\b[0-9a-fA-F]{76}\b')
  // negate intel feeds
  and not (
    sender.email.domain.root_domain in (
      "crowdstrike.com",
      "intel471.com",
      "recordedfuture.com"
    )
    and coalesce(headers.auth_summary.dmarc.pass, false)
  )
tags:
 - "Attack surface reduction"
attack_types:
  - "Extortion"
  - "Malware/Ransomware"
tactics_and_techniques:
  - "Social engineering"
  - "Out of band pivot"
  - "Evasion"
detection_methods:
  - "Content analysis"
