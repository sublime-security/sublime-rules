name: "PR# 5931 - Attachment: PDF click-to-view lure"
description: "Detects inbound messages containing a PDF attachment that matches YARA signatures identifying a red-colored 'click to view' lure."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_click_to_view_red_lure")
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "dabe5ff0-fccb-5ee4-b23d-ce989b11fea2"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5931