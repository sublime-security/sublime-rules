name: "Attachment: Encrypted PDF with Adobe lure"
description: "Detects inbound emails containing PDF attachments that match YARA signatures identifying encrypted PDFs designed to lure recipients with Adobe-themed content"
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_enc_adobe_lure")
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Encryption"
detection_methods:
  - "YARA"
  - "File analysis"
id: "583bd3de-6dce-5c20-a605-33149b50755e"
og_id: "a7fbb877-7e57-59b4-a4c3-4045bb265055"
testing_pr: 5847
testing_sha: e7ea7f30e52adaf804ae1ab87baf9172da9db8ce