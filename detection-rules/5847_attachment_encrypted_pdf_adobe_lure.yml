name: "PR# 5847 - Attachment: Encrypted PDF with Adobe lure"
description: "Detects inbound emails containing PDF attachments that match YARA signatures identifying encrypted PDFs designed to lure recipients with Adobe-themed content"
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_enc_adobe_lure")
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Encryption"
detection_methods:
  - "YARA"
  - "File analysis"
id: "583bd3de-6dce-5c20-a605-33149b50755e"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5847