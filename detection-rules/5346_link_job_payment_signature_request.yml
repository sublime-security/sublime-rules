name: "Link: Job payment and signature request"
description: "Detects inbound messages with links in the current thread, where two additional indicators are present. These indicators are related to observed cred phishing campaigns."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and 3 of (
    regex.contains(body.current_thread.text, 'Job\s#[0-9]{3,9}'),
    strings.icontains(body.current_thread.text, "review and signature"),
    strings.icontains(body.current_thread.text, "good morning"),
    strings.icontains(subject.base, 'final payment')
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Content analysis"
id: "52a1daa6-ac88-5064-a482-fac7801f0d9c"
og_id: "15b645fd-1770-5db5-a51d-32b7060184a4"
