name: "Link: Suspicious ClickUp attachment domain with credential theft indicators"
description: "Detects inbound messages containing links to clickup-attachments.com with HTML file paths, where the message body contains credential theft language with medium or high confidence. This rule identifies potential misuse of ClickUp-related infrastructure to host deceptive HTML pages designed to harvest credentials."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          .href_url.domain.root_domain == "clickup-attachments.com"
          and strings.iends_with(.href_url.path, ".html")
  )
  and any(ml.nlu_classifier(body.current_thread.text).intents,
          .name == "cred_theft" and .confidence != "low"
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Social engineering"
  - "Lookalike domain"
detection_methods:
  - "URL analysis"
  - "Natural Language Understanding"
  - "Content analysis"
id: "9f2242d0-286b-5a37-b5ce-443c08290021"
