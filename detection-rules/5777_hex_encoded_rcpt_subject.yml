name: "Subject: Hex-encoded recipient address in subject"
description: "Flags inbound messages where the subject line contains a long hexadecimal string that, when decoded, matches the recipient's email address. This technique is commonly used to personalize or track delivery of bulk unsolicited messages while obscuring the encoded data from simple string matching."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(regex.iextract(subject.base, '[0-9a-f]{20,}'),
          strings.decode_hex(.full_match) in map(recipients.to, .email.email)
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Evasion"
  - "Encryption"
detection_methods:
  - "Content analysis"
  - "Header analysis"
