name: "PR# 4923 - BEC/Fraud: Fake investment outreach from suspicious TLD"
description: |
  Detects unsolicited investment/funding outreach emails from suspicious TLDs.
  Targets mass-mailed spam campaigns offering business funding, capital allocation,
  family office outreach, and personalized investment pitches.
type: "rule"
severity: "medium"
source: |
  type.inbound
  // subject contains investment language
  and (
    strings.istarts_with(subject.base, 'financing for', 'investment into')
    or strings.icontains(subject.base, "expansion", "family office")
  )
  
  // financial body content
  and any(ml.nlu_classifier(body.current_thread.text).topics,
          .name in ("B2B Cold Outreach", "Financial Communications")
          and .confidence != "low"
  )
  
  // suspicious sender
  and (
    sender.email.domain.tld in $suspicious_tlds
    or sender.email.domain.tld == "info"
  )

tags:
  - "Attack surface reduction"
