name: "Brand impersonation: Qantas Money"
description: "Detects inbound messages where the sender display name contains 'QantasMoney' and the email body includes an image referencing 'qantas-money' or 'qantasmoney', while the sender's domain is not the legitimate qantasmoney.com domain, indicating brand impersonation."
type: "rule"
severity: "high"
source: |
  type.inbound
  and strings.icontains(sender.display_name, 'QantasMoney')
  and any(html.xpath(body.html, '//img').nodes,
          regex.icontains(.raw, 'qantas-?money')
  )
  and sender.email.domain.root_domain not in ('qantasmoney.com')
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "Image as content"
detection_methods:
  - "Sender analysis"
  - "HTML analysis"
  - "Content analysis"
id: "6639ba1e-cff1-5059-b173-7fbdc5c60159"
