name: "Link: Google Cloud Storage with zipper-interleaved tracking token"
description: "Detects inbound emails containing links to storage.googleapis.com where the URL fragment or query string contains a highly specific alphanumeric token pattern. This structured token format is characteristic of a known phishing kit that abuses Google Cloud Storage to host and deliver malicious content, leveraging the trusted domain to bypass security filters."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          .href_url.domain.domain == "storage.googleapis.com"
          // token in the fragment/query
          and any([.href_url.fragment, .href_url.query_params],
                  regex.icontains(.,
                                  '\b\d{7}[a-z]{2}\d{7,8}[a-z]{2}\d{9}[a-z]{2}\d{3,5}[a-z]{2}24[a-z]{2}[ru]\d{6}[a-z]{2}\b'
                  )
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Free file host"
  - "Evasion"
detection_methods:
  - "URL analysis"
id: "0a5c7165-8dd6-51be-923f-611c9782bc33"
