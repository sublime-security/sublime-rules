name: "PR# 5616 - Attachment: PDF OneDrive blue lure"
description: "Detects inbound messages containing PDF attachments that match a YARA signature identifying a blue-themed OneDrive lure structure."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_blue_oneDrive_lure_structure")
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "File analysis"
  - "YARA"
id: "1cf4d869-3b27-5663-a943-7d51b3e44b9c"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5616