name: "Attachment: PDF OneDrive blue lure"
description: "Detects inbound messages containing PDF attachments that match a YARA signature identifying a blue-themed OneDrive lure structure."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_blue_oneDrive_lure_structure")
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "File analysis"
  - "YARA"
id: "1cf4d869-3b27-5663-a943-7d51b3e44b9c"
og_id: "4ed638a9-4307-5f64-9890-32c17583379b"
testing_pr: 5616
testing_sha: e1e657201280dc9705ee1762a89a9aa08e8d2250