name: "Spamhaus: Mail transiting an ASN-DROP listed network"
description: "Detects inbound mail whose Received-header IP path transits IP space announced by an autonomous system on the Spamhaus ASN-DROP list — ASNs Spamhaus assesses as controlled by, or knowingly providing service to, cybercriminals. This is Spamhaus attribution, not a Sublime observation. Ranges are resolved from the listed ASNs and refresh automatically; the Spamhaus copyright, list date, and terms URL are preserved in the rule source per Spamhaus's terms."
references:
  - "https://www.spamhaus.org/drop/asndrop.json"
  - "https://www.spamhaus.org/blocklists/do-not-route-or-peer/"
type: "rule"
severity: "medium"
source: |
  // Spamhaus DROP List 2026/11/16 - (c) 2026 The Spamhaus Project SLU
  // Source: https://www.spamhaus.org/drop/asndrop.json  Terms: https://www.spamhaus.org/drop/terms/
  type.inbound
  // False positives are possible as benign mail can transit a host on the Spamhaus DROP list. Sender domain exclusions
  // can be used to reduce false positives from common/trusted domains
  and not (
    (
      sender.email.domain.root_domain in $high_trust_sender_root_domains
      or sender.email.domain.root_domain in $tranco_10k
    )
    and coalesce(headers.auth_summary.dmarc.pass, false)
  )
  and any(headers.ips,
          ip.in_range(.,
