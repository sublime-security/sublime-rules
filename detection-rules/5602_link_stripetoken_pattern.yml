name: "Link: Case-striped affiliate tracking token"
description: "Detects links carrying a known affiliate tracking token pattern. Observed in free kit, gift card, health and account suspension spam."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          // link type digit (4 = click, 5 = unsubscribe), then digit fields split by fixed-length letter filler
          regex.contains(.href_url.url,
                         '\b[45][A-Za-z]{5}\d+[A-Za-z]{4}\d+[a-z]{10}\d+[A-Z]{15}\d+[A-Z/]{1,4}\d+[A-Za-z]\d+\b'
          )
  )
attack_types:
  - "Spam"
tactics_and_techniques:
  - "Free file host"
  - "Punycode"
  - "Evasion"
detection_methods:
  - "URL analysis"
