name: "BEC/Fraud: B2B sales inquiry cold outreach lure"
description: "Detects inbound plain-text messages that mimic forwarded sales inquiries or project discussion requests, using language referencing sales teams, project requirements, and procurement officers to establish false business legitimacy. An NLU classifier confirms the message content aligns with B2B cold outreach or purchase order themes, a common pretext used to initiate contact before pivoting to fraudulent business proposals or follow-on scams."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and body.html.raw is null
  and strings.icontains(subject.base, 'sales inquiry', 'project discussion')
  and strings.icontains(body.current_thread.text,
                        'sales team',
                        'project and requirements',
                        'chief procurement officer',
  )
  and any(ml.nlu_classifier(body.current_thread.text).topics,
          .name in ("B2B Cold Outreach", "Purchase Orders")
          and .confidence != "low"
  )
attack_types:
  - "BEC/Fraud"
  - "Spam"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
