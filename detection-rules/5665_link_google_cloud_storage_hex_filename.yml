name: "Link: Google Cloud Storage hex filename pattern"
description: "Detects inbound emails containing links to storage.googleapis.com where the URL path consists of a hexadecimal hash followed by an .html extension, a pattern commonly used to host malicious or phishing content on this legitimate cloud storage service."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          strings.iends_with(.href_url.domain.domain, "storage.googleapis.com")
          and regex.imatch(.href_url.path, '/[a-f0-9]{8,32}\.html')
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Free file host"
detection_methods:
  - "URL analysis"
id: "8988b2f2-821f-5f28-80b0-80281c462a2c"
og_id: "0e20d45a-36f1-594b-8d61-950bc00a5363"
