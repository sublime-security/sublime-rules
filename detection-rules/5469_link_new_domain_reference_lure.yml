name: "Link: Newly registered domain in reference lure"
description: "Detects inbound messages where the subject line contains the word 'reference' and at least one hyperlink in the body also displays 'reference' as its link text, while pointing to a domain that was registered fewer than 90 days ago. This combination of a common business lure term paired with a recently created destination domain is a strong indicator of malicious intent."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and strings.icontains(subject.base, 'reference')
  and any(body.current_thread.links,
          strings.icontains(.display_text, 'reference')
          and network.whois(.href_url.domain).days_old < 90
  )
attack_types:
  - "Credential Phishing"
  - "BEC/Fraud"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Content analysis"
  - "URL analysis"
  - "Whois"
