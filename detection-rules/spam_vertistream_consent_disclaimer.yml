name: "Spam: VertiStream/SenderTeam consent disclaimer"
description: "Detects B2B content-syndication spam from VertiStream and its sister sending identity SenderTeam by the disclaimer they append to sponsored content offers and surveys: an 'Offered on behalf of' sponsor line followed by a statement that engaging with the email consents to sharing the recipient's data with the sponsor for sales follow-up. The disclaimer appears across every sending channel the network uses, including mail without a transaction ID element or a known tracking-link format."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and length(attachments) == 0
  and strings.icontains(body.current_thread.text, 'Offered on behalf of')
  // "By engaging with the content of this email, you agree..."
  // "By interacting with this email's content, you are agreeing..."
  and regex.icontains(body.current_thread.text,
                      'By (?:engaging|interacting) with (?:the content of this email|this email.s content), you (?:agree|are agreeing) that your data may be shared with'
  )
attack_types:
  - "Spam"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Content analysis"
id: "ec57e532-9731-569c-ba05-f6c61dc0c1aa"
