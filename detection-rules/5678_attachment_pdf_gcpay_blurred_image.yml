name: "PR# 5678 - Attachment: GCPay blurred check PDF"
description: "Detects inbound messages with PDF attachments that match a YARA signature for blurred check images observed in a GCPay related phishing document"
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_gcpay_blurred_check")
          )
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
  - "Image as content"
detection_methods:
  - "File analysis"
  - "YARA"
id: "576a624d-c969-55a7-bc32-d3a0bf15fe6c"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5678