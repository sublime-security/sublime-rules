name: "Link: Google Cloud Storage /index and /unsub link pair"
description: "This rule detects inbound messages that abuse Google Cloud Storage (storage.googleapis.com) hosting by embedding exactly two distinct links that share the same bucket directory, with paths following an /index and /unsub pattern. This structure is commonly seen in bulk spam campaigns promoting wellness products, supplement pitches, or reward/loyalty offers, where the hosted content serves as a landing page and the second link mimics an unsubscribe mechanism to lend legitimacy. The use of a trusted cloud storage domain helps the messages evade reputation-based filtering while funneling recipients to spam content."
type: "rule"
severity: "medium"
source: |
  type.inbound
  // two distinct paths
  and length(distinct(map(filter(body.links,
                                 .href_url.domain.domain == "storage.googleapis.com"
                          ),
                          .href_url.path
                      )
             )
  ) == 2
  // they are exactly /<bucket>/index or /<bucket>/unsub
  and all(distinct(map(filter(body.links,
                              .href_url.domain.domain == "storage.googleapis.com"
                       ),
                       .href_url.path
                   )
          ),
          regex.imatch(., '/[^/]+/(?:index|unsub)')
  )
  // all within the same bucket
  and length(distinct(map(filter(body.links,
                                 .href_url.domain.domain == "storage.googleapis.com"
                          ),
                          regex.extract(.href_url.path, '^/(?P<bucket>[^/]+)/')[0].named_groups["bucket"]
                      )
             )
  ) == 1
tags:
  - "Attack surface reduction"
attack_types:
  - "Spam"
tactics_and_techniques:
  - "Free file host"
  - "Social engineering"
detection_methods:
  - "URL analysis"
  - "Content analysis"
