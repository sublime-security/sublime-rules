name: "PR# 5387 - Link: Large guest list with suspicious link"
description: "Detects inbound messages containing a large guest list alongside a suspicious link"
type: "rule"
severity: "medium"
source: |
  type.inbound
  and strings.contains(body.current_thread.text,
                       '(Guest list is too large to display)'
  )
  and any(body.current_thread.links,
          (
            .href_url.path == '/'
            and regex.imatch(.href_url.query_params, '[A-Za-z0-9+/]{8}')
            and length(.href_url.query_params_decoded) == 1
            and all(flatten(values(.href_url.query_params_decoded)), . == '')
          )
          or any(ml.link_analysis(.).final_dom.links,
                 .href_url.path == '/'
                 and regex.imatch(.href_url.query_params, '[A-Za-z0-9+/]{8}')
                 and length(.href_url.query_params_decoded) == 1
                 and all(flatten(values(.href_url.query_params_decoded)), . == '')
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Evasion"
  - "Social engineering"
detection_methods:
  - "Content analysis"
  - "URL analysis"
