name: "PR# 5408 - Attachment: PDF with specific blurred lure"
description: "Detects inbound messages containing PDF attachments that match YARA signatures for a specific blurred document lure."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_blurred_cred_phish_lure")
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "File analysis"
  - "YARA"
id: "d237ba43-e187-5ce7-bb97-7473724e4f4a"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5408