name: "PR# 5116 - Observed IOC: Mail transiting OFAC-sanctioned bulletproof host Aeza Group"
description: "Detects inbound mail whose Received-header IP path transits IP space announced by Aeza Group LLC, a bulletproof hosting provider designated by the U.S. Treasury's Office of Foreign Assets Control (OFAC) on 2025-07-01 (CYBER4 / CAATSA-RUSSIA). IP ranges are the prefixes announced by Aeza's ASNs (AS210644, AS216246)."
references:
  - "https://ofac.treasury.gov/recent-actions/20250701"
  - https://github.com/sublime-security/sublime-rules/pull/5116
type: "rule"
severity: "high"
