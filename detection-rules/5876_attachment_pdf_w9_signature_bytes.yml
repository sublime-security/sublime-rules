name: "PR# 5876 - Attachment: PDF W9 form signature bytes"
description: "Detects inbound messages containing PDF attachments that match YARA signature bytes associated with IRS W9 tax forms."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_w9_signature_bytes")
          )
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
  - "YARA"
id: "5d400e12-847f-5af8-91c8-9b68722e3901"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5876