name: "Link: Google Cloud Storage with word-triple bucket and random HTML object"
description: "Detects Google Cloud Storage links using a known actor-generated bucket and object naming pattern. Observed in e-signature, wallet and account notice credential phishing."
type: "rule"
severity: "high"
source: |
  type.inbound
  and any(body.links,
          .href_url.domain.domain == "storage.googleapis.com"
          and regex.match(.href_url.path,
                          '/[a-z]+(?:-[a-z]+){2}-[a-z0-9]{10}/[a-z0-9]{20}\.html'
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Free file host"
  - "Evasion"
detection_methods:
  - "URL analysis"
