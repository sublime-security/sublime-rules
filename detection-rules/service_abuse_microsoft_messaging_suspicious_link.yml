name: "Service abuse: Microsoft messaging with suspicious recipient-referencing link"
description: "Detects inbound messages sent through Microsoft's messaging.microsoft.com infrastructure containing links that reference the recipient's own domain in the URL. These links contain either a suspicious token pattern (a long numeric token or a malformed query parameter) or route through a Cloudflare Turnstile challenge, techniques used to deliver per-recipient phishing payloads while evading automated security scanners."
type: "rule"
severity: "high"
source: |
  type.inbound
  and sender.email.domain.domain == 'messaging.microsoft.com'
  and any(filter(body.current_thread.links, .href_url.scheme != 'mailto'),
          strings.contains(.href_url.url, recipients.to[0].email.domain.domain)
          and (
            regex.icontains(.href_url.url, '=\d{15,}', '[a-z]+%[a-z]{4,}')
            or any([ml.link_analysis(., mode="aggressive")],
                   // CF Turnstile
                   any(.unique_urls_accessed,
                       .domain.domain == "challenges.cloudflare.com"
                   )
                   // or site is down behind Cloudflare
                   or (
                     regex.icontains(.final_dom.display_text,
                                     'error\s*(?:code\s*)?(?:5\d{2}|1\d{3})'
                     )
                     and regex.icontains(.final_dom.display_text, 'cloudflare')
                   )
            )
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Evasion"
  - "Social engineering"
detection_methods:
  - "URL analysis"
  - "Content analysis"
  - "Sender analysis"
id: "fca5ddba-df52-546f-9683-6800f5d23fff"
