name: "Observed IOC: Mail transiting bulletproof host - SmartApe"
description: "Detects inbound mail whose IP space is announced by SmartApe (SmartApe LLC), a Russia-based hosting provider widely reported for abuse-tolerant / bulletproof hosting. IP ranges are the prefixes announced by SmartApe's ASN (AS56694)."
type: "rule"
severity: "medium"
source: |
  // SmartApe LLC — abuse-tolerant/bulletproof host (not sanctioned) — ranges resolved 2026-08-10
  type.inbound
  and any(headers.ips,
          //
          // This rule makes use of a beta feature and is subject to change without notice
          // using the beta feature in custom rules is not suggested until it has been formally released
          //
          beta.ip_in(.ip,
                     "5.188.60.0/24",
                     "5.188.166.0/24",
                     "31.177.108.0/22",
                     "77.91.89.0/24",
                     "91.219.148.0/22",
                     "94.198.50.0/23",
                     "94.198.52.0/22",
                     "109.238.92.0/23",
                     "152.89.216.0/22",
                     "165.197.216.0/24",
                     "178.255.126.0/23",
                     "185.9.144.0/22",
                     "185.130.248.0/22",
                     "185.217.128.0/24",
                     "188.127.224.0/20",
                     "188.127.240.0/22",
                     "188.127.244.0/23",
                     "188.127.248.0/22",
                     "188.127.253.0/24",
