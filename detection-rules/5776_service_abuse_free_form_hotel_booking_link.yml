name: "PR# 5776 - Service abuse: Hotel booking via free form page"
description: "Detects inbound messages that combine conference or event terminology with hotel and reservation language, while linking to a form-building platform disguised as a legitimate booking page."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.current_thread.links,
          .href_url.domain.root_domain in $self_service_creation_platform_domains
          and regex.icontains(.display_text, '\b(?:book(?:ing)?|hotels?)\b')
  )
  
  // an event housing pitch
  and regex.icontains(body.current_thread.text,
                      '\b(?:hotels?|housing|accommodations?|room rates?|reserve your room)\b'
  )
  and strings.icontains(body.current_thread.text,
                        'annual meeting',
                        'conference',
                        'congress',
                        'convention',
                        'expo',
                        'forum',
                        'seminar',
                        'summit',
                        'symposium',
                        'trade show'
  )
  
  // sender profiles
  and (
    not profile.by_sender().solicited
    or (
      profile.by_sender().any_messages_malicious_or_spam
      and not profile.by_sender().any_messages_benign
    )
  )
  
  // negate highly trusted sender domains unless they fail DMARC authentication
  and not (
    sender.email.domain.root_domain in $high_trust_sender_root_domains
    and coalesce(headers.auth_summary.dmarc.pass, false)
  )
attack_types:
  - "Spam"
  - "BEC/Fraud"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Header analysis"
  - "Sender analysis"
  - "Content analysis"
  - "URL analysis"
