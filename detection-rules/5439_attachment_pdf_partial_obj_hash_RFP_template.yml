name: "PR# 5439 - Attachment: PDF with partial object hash matching RFP documents"
description: "Detects inbound messages containing PDF attachments with an internal object structure that matches known RFP templates. "
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              strings.starts_with(.scan.pdf_obj_hash.hash_string,
                                  "Title|ca|Annot/Link|Filter|Page|Pages|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|"
              )
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
id: "7c76a9d4-a56d-571a-87ca-e83a3de9e942"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5439