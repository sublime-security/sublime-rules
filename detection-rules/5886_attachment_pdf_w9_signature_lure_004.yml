name: "PR# 5886 - Attachment: PDF W9 form signature re-use"
description: "Detects inbound messages containing a PDF attachment that matches a YARA signature associated with W9 tax form templates."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_w9_signature_c004")
          )
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "File analysis"
  - "YARA"
id: "2779fc8b-6d88-5cc4-ac46-a54e373d15eb"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5886