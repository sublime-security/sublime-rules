name: "Attachment: PDF W9 form signature re-use"
description: "Detects inbound messages containing a PDF attachment that matches a YARA signature associated with W9 tax form templates."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_w9_signature_c004")
          )
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "File analysis"
  - "YARA"
id: "2779fc8b-6d88-5cc4-ac46-a54e373d15eb"
og_id: "231e4e69-7984-5128-ad0b-081728dc4371"
testing_pr: 5886
