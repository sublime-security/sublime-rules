name: "PR# 5257 - Link: Display text is 'unsb'"
description: "Flags inbound emails containing a link where the visible display text is the abbreviated term 'unsb'."
type: "rule"
severity: "low"
source: |
  type.inbound
  and any(body.current_thread.links, .display_text == "unsb")
