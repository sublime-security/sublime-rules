name: "Link: Unsubscribe display text abuse"
description: "Flags inbound emails containing a link where the visible display text is the abbreviated term 'unsb'."
type: "rule"
severity: "low"
source: |
  type.inbound
  and any(body.links, .display_text == "unsb")
attack_types:
  - "Spam"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "URL analysis"
  - "Content analysis"
