name: "Attachment: QuickBooks PDF lure"
description: "Detects inbound messages containing PDF attachments that match YARA signatures identifying QuickBooks-themed lure content."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "quickbooks_pdf_lures")
          )
  )
attack_types:
  - "BEC/Fraud"
  - "Malware/Ransomware"
tactics_and_techniques:
  - "PDF"
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "392ffc56-14b1-587a-91ae-55ed852d55ec"
