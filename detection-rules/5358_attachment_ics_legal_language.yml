name: "PR# 5358 - Attachment: ICS calendar file with legal language"
description: "Detects calendar files (.ics files) whose parsed event details reference legal or court-related themes such as settlements, subpoenas, litigation documents, or formal demands."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(attachments,
          (
            .file_type == "ics"
            or .file_extension == "ics"
            or .content_type in ("application/ics", "text/calendar")
          )
          //
          // This rule makes use of a beta feature and is subject to change without notice
          // using the beta feature in custom rules is not suggested until it has been formally released
          //
          and any(beta.file.parse_ics(.).events,
                  (
                    regex.icontains(strings.concat(.description, " ", .summary),
                                    '(?:dear|hi|hello).(?:counsel|team),',
                                    'file attached',
                                    '\brefer\b',
                                    '\brespon(?:d|se)\b',
                                    '\breview\b'
                    )
                    or any(.links, regex.icontains(.display_text, 'view'))
                  )
                  and regex.icontains(strings.concat(.description, " ", .summary),
                                      'case resolution material',
                                      'court-related',
                                      'court.(?:hearing|subpoena|summons)',
                                      '(?:court case|litigation).(?:document|letter)',
                                      'failure to respond',
                                      'formal.(?:demand|dispute|mediation|recovery)',
                                      'proposed counteroffer',
                                      'paga settlement',
                                      'settlement.(?:&|and.)?(?:brief|document|finalization|material|offer|releas)',
                                      "view court order"
                  )
          )
  )
  
  // negate legitimate replies
  and not (
    length(body.previous_threads) > 0
    and any(body.previous_threads,
            .sender.email.email is not null
            and any(.recipients.to, .email.email is not null)
    )
  )
  
attack_types:
  - "ICS Phishing"
  - "BEC/Fraud"
tactics_and_techniques:
  - "Social engineering"
  - "Evasion"
detection_methods:
  - "File analysis"
  - "Content analysis"
  - "URL analysis"
