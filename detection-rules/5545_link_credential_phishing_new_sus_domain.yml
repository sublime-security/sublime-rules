name: "PR# 5545 - Link: Credential theft via self-sent message with newly registered suspicious domain"
description: "Flags inbound messages where the message body is classified by NLU as credential theft with meaningful confidence, and at least one link resolves to a domain with a suspicious TLD that was registered less than 30 days ago."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(ml.nlu_classifier(body.current_thread.text).intents,
          .name == 'cred_theft' and .confidence != 'low'
  )
  and any(filter(body.current_thread.links, .href_url.scheme != 'mailto'),
          ml.link_analysis(., mode="aggressive").effective_url.domain.tld in $suspicious_tlds
          and network.whois(ml.link_analysis(., mode="aggressive").effective_url.domain
          ).days_old < 30
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Natural Language Understanding"
  - "URL analysis"
  - "Whois"
id: "c13e63e5-f25b-54ad-96a1-9fa7a723d8a3"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_D-Bolton
references:
  - https://github.com/sublime-security/sublime-rules/pull/5545