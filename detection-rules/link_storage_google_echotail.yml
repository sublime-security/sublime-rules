name: "Link: Google Cloud Storage with echo-tail od= tracking token"
description: "Detects Google Cloud Storage links carrying an od= affiliate click token (head with 13 hex counter, then account, record, and a 5 character echo of the record before a base64 tail), with or without a redirect.html fragment. Observed in fake account suspension, payment and prize spam."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          .href_url.domain.domain == "storage.googleapis.com"
          and regex.contains(.href_url.fragment,
                             '[?&]od=[0-9][a-z]{2,3}[0-9A-Za-z_]*[./][0-9a-z]{6,7}[./][a-z]{0,3}[A-Z][0-9a-z]{10,24}_x[a-z]{0,3}\d{3,5}[a-z]{0,3}[./][0-9a-z]{5}[A-Za-z0-9+/_\]]{14,}'
          )
  )
attack_types:
  - "Spam"
tactics_and_techniques:
  - "Free file host"
  - "Evasion"
detection_methods:
  - "URL analysis"
id: "7ac9ef7e-b54c-5e57-a6d3-a222d06a4ca5"
