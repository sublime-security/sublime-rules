name: "PR# 5393 - Attachment: PDF W9 signature reuse"
description: "Detects inbound messages containing PDF attachments that match YARA signatures looking for signature re-use."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_w9_signatures")
          )
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "File analysis"
  - "YARA"
id: "464d70e8-9081-5f55-8606-7aa99f498889"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5393