name: "Spamhaus: Mail transiting a DROP listed network"
description: "Detects inbound mail whose Received-header IP path transits a netblock on the Spamhaus DROP (Don't Route Or Peer) list — hijacked or leased-to-criminals IP space Spamhaus recommends blocking outright. This is Spamhaus attribution, not a Sublime observation. Ranges refresh automatically from the Spamhaus feed; the Spamhaus copyright, list date, and terms URL are preserved in the rule source per Spamhaus's terms."
references:
  - "https://www.spamhaus.org/drop/drop_v4.json"
  - "https://www.spamhaus.org/drop/drop_v6.json"
  - "https://www.spamhaus.org/blocklists/do-not-route-or-peer/"
type: "rule"
severity: "medium"
source: |
  false
tags:
  - "Attack surface reduction"
attack_types:
  - "Malware/Ransomware"
  - "Credential Phishing"
  - "BEC/Fraud"
tactics_and_techniques:
  - "Evasion"
  - "Social engineering"
detection_methods:
  - "Header analysis"
  - "Sender analysis"
false_positives:
  - "Legitimate mail transiting an IP in the Spamhaus list (e.g. a corporate relay in a broad prefix). Suppress via sender domain exclusions rather than editing the rule."
