name: "PR# 5885 - Attachment: Microsoft Teams Planner PDF lure"
description: "Detects inbound messages containing PDF attachments that match a YARA signature identifying a Microsoft Teams Planner purple-themed lure."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches,
                  .name == "pdf_msft_teams_planner_purple_lure",
              )
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "PDF"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "31c70005-8b9c-577b-8c11-e520c1f848b0"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5885