name: "Service abuse: Power BI shared document lure"
description: "Detects inbound emails containing a link to app.powerbi.com with a /view path, combined with body text patterns commonly used to lure recipients into opening a supposedly shared document, file, or proposal. Attackers abuse Power BI's legitimate reporting platform to host and redirect to credential phishing pages, leveraging its trusted domain to bypass security filters and build recipient trust."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.current_thread.links,
          .href_url.domain.domain == "app.powerbi.com"
          and strings.istarts_with(.href_url.path, "/view")
  )
  and regex.icontains(body.current_thread.text,
                      'shared (?:a|an|the)\b[^.]{0,60}\b(?:document|file|proposal|folder|documentation)',
                      'review the attached',
                      'can only be (?:viewed|opened|accessed) (?:with|on|using)'
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Social engineering"
  - "Free file host"
detection_methods:
  - "URL analysis"
  - "Content analysis"
id: "ccb16eb3-dfa6-59ac-8590-93848e303375"
