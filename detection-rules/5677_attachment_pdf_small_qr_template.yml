name: "PR# 5677 - Attachment: PDF small QR code template"
description: "Detects inbound messages containing a PDF attachment which matches a structural template associated with qr code phishing."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_small_qr_phishing_template")
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "QR code"
detection_methods:
  - "File analysis"
  - "YARA"
  - "QR code analysis"
id: "580a955d-e560-5e2a-8ff8-2fe6b36e8f68"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5677