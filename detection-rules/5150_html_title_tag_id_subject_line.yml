name: "HTML: Title tag ID correlated with subject line"
description: "Flags inbound messages where the HTML body's <title> tag is composed of multiple pipe-separated segments and one segment matches an ID pattern extracted from the subject line (e.g., '-ID: xxxx'), a signature commonly seen in automated phishing kit templates. Messages from highly trusted sender domains that pass DMARC authentication are excluded."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and regex.icontains(body.html.raw, '<title>(?:[^<|]*\|){3,}[^<]*</title>')
  and any(regex.extract(subject.base, '-\s*ID:\s*(?P<id>[a-zA-Z0-9]{2,10})'),
          strings.icontains(regex.extract(body.html.raw,
                                          '<title>(?P<t>[^<]{3,})</title>'
                            )[0].named_groups["t"],
                            strings.concat('|', .named_groups["id"], '|')
          )
  )
  
  // negate highly trusted sender domains unless they fail DMARC authentication
  and not (
    sender.email.domain.root_domain in $high_trust_sender_root_domains
    and coalesce(headers.auth_summary.dmarc.pass, false)
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Evasion"
  - "Social engineering"
detection_methods:
  - "HTML analysis"
  - "Content analysis"
  - "Header analysis"
