name: "Attachment: Malformed mobileconfig file"
description: "Detects inbound emails containing .mobileconfig attachments that are missing required Apple configuration profile keys such as PayloadType, PayloadVersion, PayloadIdentifier, and PayloadUUID. The absence of these mandatory fields indicates the file does not conform to the standard Apple configuration profile schema, suggesting it may be malformed, tampered with, or crafted for malicious purposes such as unauthorized device configuration changes."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(attachments,
          .file_extension == "mobileconfig"
          and not strings.icontains(file.parse_text(.).text,
                                    '<key>PayloadType</key>',
                                    '<key>PayloadVersion</key>',
                                    '<key>PayloadIdentifier</key>',
                                    '<key>PayloadUUID</key>'
          )
  )
  
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Evasion"
detection_methods:
  - "File analysis"
  - "XML analysis"
id: "7f1c9a32-0eec-5cba-be36-cbb335e4c2e1"
