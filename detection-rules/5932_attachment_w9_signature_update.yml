name: "PR# 5932 - Attachment: PDF W9 signature update"
description: "Detects inbound messages containing PDF attachments that match a YARA signature associated with fraudulent W9 form update lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_w9_signature_update")
          )
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "File analysis"
  - "YARA"
id: "968ed7e4-4d3a-531b-b17a-2eed8c3632c6"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5932