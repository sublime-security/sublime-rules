name: "PR# 5796 - Service abuse: Spotify callback scam notification"
description: "Detects inbound emails sent from Spotify's legitimate no-reply address where the greeting text preceding the standard 'Welcome back to Spotify' message is classified as callback scam content, indicating the genuine notification template has been abused to deliver scam instructions."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and sender.email.email == "no-reply@spotify.com"
  and any(regex.iextract(body.current_thread.text,
                         '(?P<greeting>[^\n]+)\nWelcome back to Spotify'
          ),
          any(ml.nlu_classifier(.named_groups['greeting']).intents,
              .name == "callback_scam"
          )
  )
attack_types:
  - "Callback Phishing"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Natural Language Understanding"
  - "Sender analysis"
  - "Content analysis"
id: "58c3498b-05a2-5c27-a547-8beee9d295a8"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_markmsublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5796