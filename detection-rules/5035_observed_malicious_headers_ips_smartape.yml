name: "PR# 5035 - Observed IOC: Mail transiting bulletproof host - SmartApe"
description: "Detects inbound mail whose IP space is announced by SmartApe (SmartApe LLC), a Russia-based hosting provider widely reported for abuse-tolerant / bulletproof hosting. IP ranges are the prefixes announced by SmartApe's ASN (AS56694) as of 2026-08-05."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(headers.ips,
          //
          // This rule makes use of a beta feature and is subject to change without notice
          // using the beta feature in custom rules is not suggested until it has been formally released
          //
          beta.ip_in(.ip,
                     "5.188.60.0/24",
                     "5.188.166.0/24",
                     "31.177.108.0/22",
