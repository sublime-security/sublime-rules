name: "PR# 5634 - Attachment: Fake LinkedIn invoice PDF lure"
description: "Detects inbound messages containing a PDF attachment that matches YARA signatures identifying fake LinkedIn invoice lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_fake_linkedIn_invoice_lure")
          )
  )
attack_types:
  - "BEC/Fraud"
  - "Credential Phishing"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "PDF"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "ac166829-d49e-57fb-95ee-fa4f90f3d31e"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5634