name: "PR# 5495 - Attachment: PDF Object Hash - Generic OneDrive lures"
description: "Detects inbound emails containing PDF attachments where an embedded object's hash matches a specific known object hash previously associated with OneDrive lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              .scan.pdf_obj_hash.object_hash in (
                "6660a05ed00da8a0d1812eca2c993220", // Blue OneDrive lure & blurred generic phishing
              )
          )
  )
attack_types:
  - "Malware/Ransomware"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
id: "b9216af6-7672-5626-b63a-c7f6e4d42d63"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5495