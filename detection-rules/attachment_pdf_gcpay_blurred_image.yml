name: "Attachment: GCPay blurred check PDF"
description: "Detects inbound messages with PDF attachments that match a YARA signature for blurred check images observed in a GCPay related phishing document"
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_gcpay_blurred_check")
          )
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
  - "Image as content"
detection_methods:
  - "File analysis"
  - "YARA"
id: "d3ceaac4-a49a-515a-ad76-0fcc13800542"
