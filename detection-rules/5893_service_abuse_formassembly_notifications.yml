name: "PR# 5893 - Service abuse: FormAssembly notifications with suspicious links"
description: "Detects inbound messages containing legitimate-looking FormAssembly order and form-response notifications that have been abused to inject scam lures pointing to suspicious links. The messages mimic genuine automated notifications but contain embedded text promoting fake priority gateways, VIP passcodes, or ticket/voucher claims designed to lure recipients into visiting attacker-controlled pages."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and sender.email.domain.root_domain == "formassembly.com"
  and any($free_subdomain_hosts, strings.icontains(body.current_thread.text, .))
attack_types:
  - "Spam"
  - "Credential Phishing"
tactics_and_techniques:
  - "Free subdomain host"
  - "Social engineering"
  - "Impersonation: Brand"
detection_methods:
  - "Content analysis"
  - "URL analysis"
  - "Sender analysis"
id: "6dfbaa06-1f52-5d63-ac6e-6e0da9aa6d97"
tags:
