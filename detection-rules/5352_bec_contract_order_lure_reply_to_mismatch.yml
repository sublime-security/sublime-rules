name: "PR# 5352 - BEC/Fraud: Contract or order lure with mismatched reply-to"
description: "Detects inbound messages where the reply-to address differs from the sender's address, while the subject line references a contract agreement or order with an 8-digit numeric identifier and the body text mentions an attached contract or order. This combination is a common tactic in business email compromise attempts designed to redirect replies to an attacker-controlled address."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(headers.reply_to, .email.email != sender.email.email)
  and regex.icontains(subject.subject, '(?:contract agreement|order)_\d{8}\b')
  and regex.icontains(body.current_thread.text,
                      'attached (?:contract agreement|order)'
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "Spoofing"
  - "Social engineering"
detection_methods:
  - "Header analysis"
  - "Content analysis"
id: "2955fab4-d1a9-597b-9a47-3ec66f21642a"
tags:
