name: "PR# 5223 - Brand impersonation: Deloitte LLC domain in CC"
description: "Flags inbound messages where a recipient in the CC field—either in the message itself or within a previous email thread included in the body—uses the deloittellc.com root domain. This can indicate an attempt to impersonate or leverage Deloitte's identity to add legitimacy to a message or exploit a hijacked thread."
type: "rule"
severity: "high"
source: |
  type.inbound
  and (
    any(recipients.cc, .email.domain.root_domain == 'deloittellc.com')
    or any(body.previous_threads,
           any(.recipients.cc, .email.domain.root_domain == 'deloittellc.com')
    )
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "Header analysis"
id: "af830ed8-68f1-5ee6-aca1-e1b102511121"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_D-Bolton
references:
  - https://github.com/sublime-security/sublime-rules/pull/5223