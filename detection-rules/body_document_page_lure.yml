name: "Social engineering: Document page reference lure"
description: "Detects inbound messages containing phrasing that references specific document page numbers, a pattern commonly used to lend false legitimacy to fraudulent requests involving document review or signature."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and regex.icontains(body.current_thread.text, '\x6f\x6e\x20\x70\x61\x67\x65\x73 \d[a-z] \x61\x6e\x64 \d[a-z]')
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Content analysis"
  - "Threat intelligence"