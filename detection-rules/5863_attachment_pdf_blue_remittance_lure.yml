name: "Attachment: PDF blue remittance lure"
description: "Detects inbound messages containing a PDF attachment that matches observed lures from a fake remittance campaign."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_blue_remittance_lure")
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "b83fed2d-7bfe-546b-bff5-02c86653a13e"
og_id: "5324403c-48ac-5df7-97ee-7e93a5950cf8"
testing_pr: 5863
testing_sha: e0991eebd59b548e00b7985cb73defd12c8e68e7