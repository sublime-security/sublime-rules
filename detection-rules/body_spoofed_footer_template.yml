name: "Body: Spoofed automated notification footer template"
description: "Detects emails with a specific footer template including a specific gray color (#9d9d9d) applied to some text, as well as a fake copyright notice."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(html.xpath(body.html, '//table/tbody/tr/td').nodes,
          strings.icontains(.raw, "#9d9d9d")
          and .inner_text == "Please do not reply to this email."
  )
  and any(html.xpath(body.html, '//table/tbody/tr/td').nodes,
          strings.starts_with(.inner_text, "© ")
          and strings.ends_with(.inner_text, ".")
  )
attack_types:
  - "Credential Phishing"
  - "Spam"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "HTML analysis"
  - "Content analysis"
id: "9891ab38-5f62-5bfe-b740-d0ab6844eceb"
