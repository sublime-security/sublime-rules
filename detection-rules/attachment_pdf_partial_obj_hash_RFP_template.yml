name: "Attachment: PDF with partial object hash matching RFP documents"
description: "Detects inbound messages containing PDF attachments with an internal object structure that matches known RFP templates. "
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"), 
      any(file.explode(.),
          strings.starts_with(.scan.pdf_obj_hash.hash_string, "Title|ca|Annot/Link|Filter|Page|Pages|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|StructElem|")
      )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
