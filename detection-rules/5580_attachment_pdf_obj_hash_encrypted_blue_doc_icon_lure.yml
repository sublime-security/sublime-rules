name: "PR# 5580 - Attachment: PDF Object Hash - Encrypted PDF with blue doc icon"
description: "Detects inbound messages containing a PDF attachment whose object structure matches a known malicious PDF object hash."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              .scan.pdf_obj_hash.object_hash == "24012ed37455f6b8581bae5c6fed0a6f"
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
id: "a8b27b1b-d278-53ac-9368-780768a442a7"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5580