name: "Attachment: PDF Object Hash - Encrypted PDF with blue doc icon"
description: "Detects inbound messages containing a PDF attachment whose object structure matches a known malicious PDF object hash."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              .scan.pdf_obj_hash.object_hash == "24012ed37455f6b8581bae5c6fed0a6f"
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
id: "a8b27b1b-d278-53ac-9368-780768a442a7"
og_id: "0c2d79ef-6c79-5842-8d88-3c4a78c2cc6d"
testing_pr: 5580
testing_sha: 228ce9439b20c9d356bd4527f07afec75bda83cc