name: "Headers: Randomized mailer identifier string"
description: "Flags inbound messages whose Mailer header contains a randomly generated alphanumeric string following a consistent 'Mailer-' pattern, a signature of mass-mailing tools used to distribute bulk fraudulent messages. Observed samples reuse the same fake ACH payment disbursement/order status subject line while rotating across many unrelated sender addresses and domains, a tactic designed to evade sender-based filtering and push recipients toward fraudulent payment or financial lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and regex.imatch(headers.mailer, 'Mailer-[a-z0-9]{6,12}')
attack_types:
  - "Credential Phishing"
  - "BEC/Fraud"
tactics_and_techniques:
  - "Social engineering"
  - "Spoofing"
  - "Evasion"
detection_methods:
  - "Header analysis"
  - "Sender analysis"
id: "952eb868-38eb-50d1-a0c4-b07a8d3d3b1d"
