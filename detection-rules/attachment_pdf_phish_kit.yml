name: "Attachment: PDF phishing kit with mailto obfuscation or tracked links"
description: "Flags inbound emails carrying PDF attachments that exhibit phishing kit artifacts: either a mailto link padded with invisible combining grapheme joiner characters (U+034F) that is tailored to the recipient's domain, or a PDF file named after the recipient's organization that embeds email click-tracking URLs from legitimate ESPs (SendGrid, SparkPost, AWS SES). Both patterns indicate the PDF was generated by a phishing kit that renders tracked, recipient-specific content to evade detection while harvesting engagement data."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          // the kit's mailto at the recipient's domain, padded with combining grapheme joiners (U+034F)
          any(file.explode(.),
              any(.scan.pdf.urls,
                  strings.istarts_with(.url, 'mailto:')
                  and strings.icontains(.url, '%CD%8F')
                  and any(recipients.to,
                          .email.domain.valid
                          and strings.icontains(..url,
                                                strings.concat("@",
                                                               .email.domain.domain
                                                )
                          )
                  )
              )
          )
          // or the file is named for the recipient's org... france-docs.pdf sent to @france-docs.fr
          // and carries an email click-tracker... the kit rendered a tracked email into the file
          or (
            any(recipients.to,
                .email.domain.valid
                and ..file_name =~ strings.concat(.email.domain.sld, ".pdf")
            )
            and any(file.explode(.),
                    any(.scan.pdf.urls,
                        .domain.root_domain in (
                          "sendgrid.net", // sendgrid ct.sendgrid.net/ls/clic
                          "sparkpostmail1.com", // sparkpost go.sparkpostmail1.com/f/a/
                          "awstrack.me" // amazon ses click tracking
                        )
                        // sendgrid branded-link tracking on the sender's own
                        or regex.icontains(.url,
                                           '/(?:ls/click\?upn=|ss/c/)u001\.'
                        )
                    )
            )
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Evasion"
  - "Open redirect"
  - "Social engineering"
detection_methods:
  - "File analysis"
  - "URL analysis"
  - "Content analysis"
id: "8c4b85a9-6c9e-53a9-8381-3406d69051ee"
