name: "Service abuse: Zoho meeting notification callback scam"
description: "Flags inbound messages sent from Zoho's meeting notification service where the body content is classified by NLU as a callback scam with medium or high confidence."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and sender.email.email == "noreply@user.zohomeetingnotifications.eu"
  and any(ml.nlu_classifier(body.current_thread.text).intents,
          .name == "callback_scam" and .confidence != "low"
  )
attack_types:
  - "Callback Phishing"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Natural Language Understanding"
  - "Sender analysis"
id: "bd79e84f-5a93-5c63-a03f-8a98988fb0df"
og_id: "b2f81768-0781-5ee0-ad96-4567dfaa0b9f"
testing_pr: 5770
