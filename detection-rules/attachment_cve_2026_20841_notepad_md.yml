name: "Attachment: MD file exploiting CVE-2026-20841 Microsoft Notepad Markdown"
description: "A markdown file with content that exploits CVE-2026-20841, a Windows Notepad vulnerability that allows malicious links in Markdown (.md) files to leverage Windows URI handlers such as file:// or ms-appinstaller:// to execute unauthorized commands. "
type: "rule"
severity: "critical"
source: |
  type.inbound
  and any(attachments,
      .file_extension == "md"
      and 
      any(file.explode(.),
              regex.icontains(.scan.strings.raw, "\\[.+]\\((file://|ms-appinstaller:)")
          )
  ) 
attack_types:
  - "Malware/Ransomware"
tactics_and_techniques:
  - "Exploit"
detection_methods:
  - "File analysis"
tags:
  - "Suspicious attachment"
  - "CVE-2026-20841"
