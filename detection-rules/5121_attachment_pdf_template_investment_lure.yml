name: "Attachment: PDF templated investment lure"
description: "Detects inbound messages carrying PDF attachments that match a YARA signature for a recurring templated lure using a blue and white design theme. "
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_templated_lure_blue_white")
          )
  )
attack_types:
  - "Malware/Ransomware"
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "b557604b-b3af-5777-9531-34ed9ee648e0"
og_id: "6bae8ea0-544a-5771-a488-18da6b1e861b"
testing_pr: 5121
testing_sha: 5220bcfaa635018096b73807426b4ae7bc993e04