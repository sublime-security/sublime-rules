name: "PR# 5121 - Attachment: PDF templated investment lure"
description: "Detects inbound messages carrying PDF attachments that match a YARA signature for a recurring templated lure using a blue and white design theme. "
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_templated_lure_blue_white")
          )
  )
attack_types:
  - "Malware/Ransomware"
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "b557604b-b3af-5777-9531-34ed9ee648e0"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5121