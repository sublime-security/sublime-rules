name: "Link: Malformed protocol-relative URL"
description: "Detects inbound emails containing malformed links."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
      strings.starts_with(.href_url.path, '//')
      and .href_url.domain.domain is null
      and regex.contains(.href_url.path, './/.')
      and regex.contains(.href_url.path, '[^/]/')
  )
tags:
  - "Attack surface reduction"
attack_types:
  - "Malware/Ransomware"
tactics_and_techniques:
  - "Evasion"
detection_methods:
  - "URL analysis"
