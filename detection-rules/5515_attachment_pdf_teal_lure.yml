name: "Attachment: PDF teal sharepoint lure"
description: "Detects inbound emails containing PDF attachments that match a yara rule looking for specific teal sharepoint lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_teal_web2pdf")
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
  - "YARA"
id: "a72a60e0-440e-50b9-978c-247248d2815f"
og_id: "2c35e244-685c-5c64-a818-6ae985c687a0"
