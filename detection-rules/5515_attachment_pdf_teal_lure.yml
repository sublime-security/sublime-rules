name: "PR# 5515 - Attachment: PDF teal SharePoint lure"
description: "Detects inbound emails containing PDF attachments that match a yara rule looking for specific teal SharePoint lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_teal_web2pdf")
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
  - "YARA"
id: "a72a60e0-440e-50b9-978c-247248d2815f"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5515