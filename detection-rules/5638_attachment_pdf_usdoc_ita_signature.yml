name: "PR# 5638 - Attachment: PDF USDOC ITA signature lure"
description: "Flags inbound messages containing PDF attachments that match a YARA rule looking for signature overlaps in observed USDOC ITA lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_ITA_signature_lure")
          )
  )
attack_types:
  - "Credential Phishing"
  - "Malware/Ransomware"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
  - "YARA"
id: "019ffe38-1331-51d6-b92e-38fcd7f46b41"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5638