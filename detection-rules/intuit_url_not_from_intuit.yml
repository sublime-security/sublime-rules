name: "Link: Possible Intuit link abuse"
description: "Detects messages linking to Intuit notification domains from non-Intuit senders, combined with credential harvesting language and file sharing themes"
type: "rule"
severity: "medium"
source: |
  type.inbound
  // look for links to links.notification.intuit.com but the sender is not from quickbooks/intuit
  and any(body.current_thread.links,
          .href_url.domain.domain == "links.notification.intuit.com"
  )
  and not sender.email.domain.root_domain in ("quickbooks.com", "intuit.com")
  and not any(headers.domains, .root_domain in ("quickbooks.com", "intuit.com"))
  and length(body.current_thread.text) < 1750
tags:
 - "Attack surface reduction"
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "URL analysis"
  - "Natural Language Understanding"
  - "Content analysis"
  - "Header analysis"
id: "cd15cc34-76b3-5993-bade-053e05b2ad48"
