name: "PR# 5888 - Attachment: PDF disclosure lure"
description: "Detects inbound emails containing PDF attachments that match YARA signatures identifying disclosure-themed social engineering lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_disclosure_slop_lure")
          )
  )
attack_types:
  - "Credential Phishing"
  - "BEC/Fraud"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "23f16ae4-d2d8-529e-a542-90a4a25512c8"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5888