name: "PR# 5617 - Attachment: PDF SSA lure"
description: "Detects inbound messages containing PDF attachments that match a YARA signature identifying content associated with Social Security Administration (SSA) themed lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.), any(.scan.yara.matches, .name == "pdf_ssa_lure"))
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "f8dd2d98-b426-56ae-b131-75a18d0e290d"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5617