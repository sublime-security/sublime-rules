name: "Attachment: PDF SSA lure"
description: "Detects inbound messages containing PDF attachments that match a YARA signature identifying content associated with Social Security Administration (SSA) themed lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.), any(.scan.yara.matches, .name == "pdf_ssa_lure"))
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "f8dd2d98-b426-56ae-b131-75a18d0e290d"
og_id: "73b7820d-f833-511c-a8a7-19081b7bf1be"
testing_pr: 5617
testing_sha: c9747750d307a98893f4434a8f10d2b8408e2509