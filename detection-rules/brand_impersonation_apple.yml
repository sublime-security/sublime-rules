name: "Brand impersonation: Apple credential theft"
description: "Detects inbound messages impersonating Apple that combine multiple brand-specific keywords and address details with NLU-detected organization entities referencing Apple and a high-confidence credential theft intent. Legitimate mail from highly trusted domains is excluded unless it fails DMARC authentication, reducing false positives while surfacing spoofed Apple support or account notifications used to harvest credentials."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and sender.email.domain.root_domain != "apple.com"
  and 2 of (
    strings.icontains(body.current_thread.text, "apple id"),
    strings.icontains(body.current_thread.text, "apple account"),
    strings.icontains(body.current_thread.text, "apple support"),
    strings.icontains(body.current_thread.text, "case id"),
    strings.icontains(body.current_thread.text, "payment method"),
    strings.icontains(body.current_thread.text, "©"),
    strings.icontains(body.current_thread.text, "terms of service"),
    2 of (
      strings.icontains(body.current_thread.text, 'Apple'),
      strings.icontains(body.current_thread.text, 'Apple Way Park'),
      strings.icontains(body.current_thread.text, 'Cupertino, CA')
    )
  )
  and any(ml.nlu_classifier(body.current_thread.text).entities,
          .name == "org" and strings.icontains(.text, "Apple")
  )
  and any(ml.nlu_classifier(body.current_thread.text).intents,
          .name == "cred_theft" and .confidence == "high"
  )
  // negate highly trusted sender domains unless they fail DMARC authentication
  and not (
    sender.email.domain.root_domain in $high_trust_sender_root_domains
    and coalesce(headers.auth_summary.dmarc.pass, false)
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "Social engineering"
  - "Spoofing"
  - "HTML smuggling"
  - "LNK"
detection_methods:
  - "Natural Language Understanding"
  - "Content analysis"
  - "Header analysis"
  - "Sender analysis"
