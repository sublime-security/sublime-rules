name: "Attachment: PDF small QR code template"
description: "Detects inbound messages containing a PDF attachment which matches a structural template associated with qr code phishing."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"), 
      any(file.explode(.),
          any(.scan.yara.matches, .name == "pdf_small_qr_phishing_template")
      )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "QR code"
detection_methods:
  - "File analysis"
  - "YARA"
  - "QR code analysis"
