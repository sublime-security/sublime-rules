name: "Impersonation: SAM/SBA federal registration"
description: "Detects inbound messages impersonating SAM.gov or the Small Business Administration by matching sender display names against known spoofed naming patterns (e.g. sba-support, sam registration/renewal) or by identifying sam.gov references paired with an embedded 'renew entity' image lure. Legitimate senders from verified sba.gov, sam.gov, or other high-trust domains that pass DMARC authentication are excluded."
type: "rule"
severity: "high"
source: |
  type.inbound
  and (
    regex.icontains(sender.display_name,
                    '^sam(?:\.gov\b|\s(?:renew|compliance))',
                    'final\ssam\.gov',
                    '^sba[\s-]?(?:e[fd]|[\.,]gov)',
                    '^sba[\s-](?:connect|invoice|admin|eidl|profile)\b',
                    '^sba[\s-]support[\s-]\w+'
    )
    or (
      (
        strings.icontains(body.current_thread.text,
                          'sam.gov',
                          'system for award management'
        )
        or any(ml.nlu_classifier(body.current_thread.text).entities,
               .name == "org"
               and regex.icontains(.text, '\bsba.gov', 'small business admin')
        )
      )
      and (
        any(html.xpath(body.html, '//img/@src').nodes,
            strings.icontains(.raw, 'sam%20renew%20entity')
            or regex.icontains(.raw, '[./]sam[a-z]{3,}\.com')
        )
        or regex.icontains(subject.base,
                           'cage\s+code\s+[a-z0-9]{5}',
                           'sam\s(?:renew|status)'
        )
        or any(regex.iextract(body.current_thread.text,
                              'cage\s+code:?\s*([a-z0-9]{5})'
               ),
               strings.icontains(subject.base, .groups[0])
        )
      )
    )
  )
  and not (
    sender.email.domain.root_domain in $high_trust_sender_root_domains
    and coalesce(headers.auth_summary.dmarc.pass, false)
  )
attack_types:
  - "Credential Phishing"
  - "BEC/Fraud"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "Social engineering"
  - "Image as content"
detection_methods:
  - "Sender analysis"
  - "Content analysis"
  - "HTML analysis"
  - "Header analysis"
