name: "PR# 5497 - Service abuse: Apple callback scam"
description: "Detects inbound messages spoofing Apple's automated notification address where the reply-to domain diverges from apple.com, combined with a natural language understanding classifier identifying callback scam intent in the message body with medium or high confidence."
type: "rule"
severity: "medium"
source: |
    type.inbound
    and sender.email.email == "noreply@email.apple.com"
    and any(headers.reply_to, .email.domain.root_domain != "apple.com")
    and any(ml.nlu_classifier(body.current_thread.text).intents,
            .name == "callback_scam" and .confidence != "low"
    )
attack_types:
  - "Callback Phishing"
tactics_and_techniques:
  - "Social engineering"
  - "Out of band pivot"
detection_methods:
  - "Sender analysis"
  - "Header analysis"
  - "Natural Language Understanding"
id: "2a5f3ed9-cfc5-5fbc-8c39-56a87e35183d"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_markmsublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5497