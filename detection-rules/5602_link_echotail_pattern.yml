name: "Link: Echo-tail od= affiliate tracking token"
description: "Detects links carrying a known affiliate tracking token pattern. Observed in account suspension, payment and prize spam."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          regex.contains(.href_url.url,
                         '[?&]od=[0-9][a-z]{2,3}[0-9A-Za-z_]*[./][0-9a-z]{6,7}[./][a-z]{0,3}[A-Z][0-9a-z]{10,24}_x[a-z]{0,3}\d{3,5}[a-z]{0,3}[./][0-9a-z]{5}[A-Za-z0-9+/_\]]{14,}'
          )
  )
attack_types:
  - "Spam"
tactics_and_techniques:
  - "Free file host"
  - "Evasion"
detection_methods:
  - "URL analysis"
id: "9ebdfa0a-f323-5390-8bd2-c0be5759395d"
og_id: "7ac9ef7e-b54c-5e57-a6d3-a222d06a4ca5"
