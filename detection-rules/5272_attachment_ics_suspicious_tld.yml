name: "Attachment: Calendar invite with suspicious TLD and oversized guest list"
description: "Detects inbound messages from senders on suspicious top-level domains where the subject begins with 'Invitation' and the message includes a calendar (.ics) attachment. The body also contains the phrase '(Guest list is too large to display)', a common social engineering tactic used to explain the absence of visible recipients and lend false legitimacy to the invite. This combination is indicative of calendar-based phishing attempting to lure recipients into interacting with a malicious invitation."
type: "rule"
severity: "low"
source: |
  type.inbound
  and sender.email.domain.tld in $suspicious_tlds
  and strings.starts_with(subject.base, 'Invitation')
  and any(attachments,
          (
            .file_type == "ics"
            or (
              .file_extension == "ics"
              or .content_type in ("application/ics", "text/calendar")
            )
          )
  )
  and strings.icontains(body.current_thread.text,
                        '(Guest list is too large to display)'
  )
tags:
  - "Attack surface reduction"
attack_types:
  - "ICS Phishing"
tactics_and_techniques:
  - "Social engineering"
  - "Evasion"
detection_methods:
  - "Content analysis"
  - "File analysis"
  - "Sender analysis"
  - "Header analysis"
