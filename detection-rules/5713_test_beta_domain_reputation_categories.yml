name: "Test: Sender domain reputation with over 1000 categories"
description: "Test rule that evaluates the beta domain reputation function against the sender's email domain, matching when the domain has more than 1000 categories."
type: "rule"
severity: "low"
source: |
  type.inbound
  //
  // This rule makes use of a beta feature and is subject to change without notice
  // using the beta feature in custom rules is not suggested until it has been formally released
  //
  and length(beta.domain_reputation(sender.email.domain).categories) > 1000
tags:
  - "Attack surface reduction"
detection_methods:
  - "Sender analysis"
