name: "PR# 5317 - Sender: Suspicious CC suffix in sender display name"
description: "Detects inbound messages where the sender's display name ends with a 'cc:' or 'CC:' suffix, a tactic often used to appear as though they're recipients rather than part of the attacker's sender identity."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and strings.ends_with(sender.display_name, 'cc:', 'CC:')
attack_types:
  - "BEC/Fraud"
  - "Credential Phishing"
tactics_and_techniques:
  - "Social engineering"
  - "Spoofing"
detection_methods:
  - "Sender analysis"
id: "1015ff56-89db-5e9a-a242-963732c72c85"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_D-Bolton
references:
  - https://github.com/sublime-security/sublime-rules/pull/5317