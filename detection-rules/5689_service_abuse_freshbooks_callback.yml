name: "PR# 5689 - Service abuse: Freshbooks callback scam"
description: "Detects inbound messages sent from the freshbooks.com root domain where the body text is classified by an NLU model as containing callback scam intent with medium or high confidence. This identifies legitimate Freshbooks infrastructure being abused to deliver callback scam lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and sender.email.domain.root_domain == "freshbooks.com"
  and any(ml.nlu_classifier(body.current_thread.text).intents,
          .name == "callback_scam" and .confidence != "low"
  ) 
attack_types:
  - "Callback Phishing"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Natural Language Understanding"
  - "Sender analysis"
id: "2249633e-d9eb-50eb-bedd-6069775c53ad"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_markmsublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5689