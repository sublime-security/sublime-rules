name: "Link: Google Cloud Storage with double base64 encoded fragment"
description: "Detects Google Cloud Storage links whose fragment is a base64 encoded value that decodes to another base64 value, a known actor-controlled redirect token pattern. Observed in reward and account suspension spam."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          .href_url.domain.domain == "storage.googleapis.com"
          and regex.match(.href_url.fragment, '[A-Za-z0-9+/]{100,160}={0,2}')
          and regex.match(strings.decode_base64(.href_url.fragment,
                                                ignore_padding=true
                          ),
                          '[A-Za-z0-9+/]{80,120}={0,2}'
          )
  )
attack_types:
  - "Spam"
tactics_and_techniques:
  - "Free file host"
  - "Evasion"
detection_methods:
  - "URL analysis"
id: "2853361b-d899-5258-a4ba-ba293aa8f66e"
