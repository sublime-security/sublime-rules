name: "PR# 5352 - BEC/Fraud: Contract agreement reply-to mismatch"
description: "Detects inbound messages referencing a contract agreement where the reply-to address does not match the sender's email address. The subject line follows a 'contract agreement_########' pattern and the body references an attached contract agreement, indicating a likely business email compromise attempt using a reply-to mismatch to redirect victim responses."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(headers.reply_to, .email.email != sender.email.email)
  and regex.icontains(subject.subject, 'contract agreement_\d{8}\b')
  and strings.icontains(body.current_thread.text, 'attached contract agreement')
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "Spoofing"
  - "Social engineering"
detection_methods:
  - "Header analysis"
  - "Content analysis"
id: "315f995d-921e-5aae-a478-baa7f08f95f9"
tags:
  - created_from_open_prs
