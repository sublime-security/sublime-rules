name: "PR# 5851 - Service abuse: AWS S3 image map"
description: "Detects inbound emails containing an HTML image map where the image source and clickable area links are both hosted on Amazon S3 (amazonaws.com). This technique abuses a trusted cloud storage service to host deceptive content and disguise malicious links behind an interactive image, helping evade traditional link-based detection."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(html.xpath(body.html, '//img[@usemap]/@src').nodes,
          strings.parse_url(.raw).domain.root_domain == "amazonaws.com"
  )
  and any(html.xpath(body.html, '//area/@href').nodes,
          strings.parse_url(.raw).domain.root_domain == "amazonaws.com"
  )
attack_types:
  - "Credential Phishing"
  - "Spam"
tactics_and_techniques:
  - "Image as content"
  - "Free file host"
detection_methods:
  - "HTML analysis"
  - "URL analysis"
id: "3621642b-0969-5766-a07b-1b2bdd4bac74"
tags:
  - created_from_open_prs
