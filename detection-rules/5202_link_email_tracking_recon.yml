name: "Link: Email tracking subdomain recon"
description: "Flags inbound messages that contain a link pointing to an 'emailtracking' subdomain of the sender's own root domain with no URL paths, likely used for reconnaissance."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.current_thread.links,
          .href_url.domain.root_domain == sender.email.domain.root_domain
          and .href_url.domain.subdomain == "emailtracking"
          and length(.href_url.path) is null
  )
  and any(regex.extract(body.html.raw,
                        "<a.*?>[\r\n]{0,2}[a-zA-Z0-9-'’%]*?[.,?!]?</a>\\s([0-9a-zA-Z-'’%]+[.,?!]?\\s[0-9a-zA-Z-'’%]+[.,?!'])"
          ),
          strings.ends_with(body.html.display_text, .groups[0])
  )
attack_types:
  - "Reconnaissance"
detection_methods:
  - "URL analysis"
  - "HTML analysis"
  - "Content analysis"
