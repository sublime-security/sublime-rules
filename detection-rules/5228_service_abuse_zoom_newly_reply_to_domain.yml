name: "PR# 5228 - Service abuse: Zoom with newly registered or unregistered reply-to domain"
description: "Detects messages from legitimate Zoom infrastructure (no-reply@zoom.us) that contain a reply-to address with a domain registered within the last 45 days or is not registered, indicating potential abuse of Zoom's service for malicious purposes."
type: "rule"
severity: "medium"
source: |
  type.inbound
  // Legitimate zoom sending infrastructure
  and sender.email.email == "no-reply@zoom.us"
  and ( 
    // newly registered reply-to domain
    network.whois(headers.reply_to[0].email.domain).days_old < 45
    // or unregistered
    or network.whois(headers.reply_to[0].email.domain).found == false
  )
tags:
  - "Attack surface reduction"
  - pr_author_zoomequipd
  - created_from_open_prs
