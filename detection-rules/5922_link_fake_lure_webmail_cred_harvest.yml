name: "Link: Fake lure to webmail credential harvesting"
description: "Inbound messages impersonate electronic invoice or billing notifications, sent from disposable addresses hosted on VPS/OVH infrastructure. The body contains a link crafted to mimic a webmail client's message retrieval action (task=mail, action=get) with mailbox and token parameters, redirecting recipients to an external domain unrelated to the sender or organization in order to harvest webmail credentials."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          .href_url.query_params_decoded["_task"][0] == "mail"
          and .href_url.query_params_decoded["_action"][0] == "get"
          and '_mbox' in keys(.href_url.query_params_decoded)
          and '_token' in keys(.href_url.query_params_decoded)
          and .href_url.domain.root_domain != sender.email.domain.root_domain
          and .href_url.domain.root_domain not in $org_domains
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Social engineering"
  - "Out of band pivot"
detection_methods:
  - "URL analysis"
  - "Sender analysis"
  - "Content analysis"
