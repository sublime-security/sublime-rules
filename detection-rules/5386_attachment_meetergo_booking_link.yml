name: "Attachment: Meetergo booking link"
description: "Detects inbound messages containing an attachment that embeds a link to a Meetergo scheduling page."
type: "rule"
severity: "medium"
source: |
  type.inbound
  
  // booking link within attachment
  and any(attachments,
          any(file.explode(.),
              any(.scan.url.urls,
                  strings.starts_with(.url, "https://cal.meetergo.com/d")
              )
          )
  )

attack_types:
  - "BEC/Fraud"
  - "Credential Phishing"
tactics_and_techniques:
  - "Social engineering"
  - "Evasion"
detection_methods:
  - "File analysis"
  - "URL analysis"
