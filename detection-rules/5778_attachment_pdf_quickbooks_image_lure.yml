name: "Attachment: QuickBooks payment image lure PDF"
description: "Detects inbound messages containing PDF attachments that match a YARA signature identifying QuickBooks-branded payment image lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches,
                  .name == "pdf_quickbooks_payment_image_lure"
              )
          )
  )
attack_types:
  - "BEC/Fraud"
  - "Credential Phishing"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "PDF"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "9c16f467-16e8-53af-9edb-17c0193483d1"
og_id: "56a09ea6-30f1-5ae8-b05c-d794f2981180"
testing_pr: 5778
testing_sha: 827c238931fd5e9ed3287ba5de31ef0ef9221708