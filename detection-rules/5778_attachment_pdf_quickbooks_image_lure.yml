name: "PR# 5778 - Attachment: QuickBooks payment image lure PDF"
description: "Detects inbound messages containing PDF attachments that match a YARA signature identifying QuickBooks-branded payment image lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches,
                  .name == "pdf_quickbooks_payment_image_lure"
              )
          )
  )
attack_types:
  - "BEC/Fraud"
  - "Credential Phishing"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "PDF"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "9c16f467-16e8-53af-9edb-17c0193483d1"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5778