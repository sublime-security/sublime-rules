name: "Link: New login detected notification"
description: "Detects inbound emails with a 'New Login Detected' subject line and matching header text, paired with a hyperlink styled in a distinct green color."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and subject.base =~ "New Login Detected"
  and any(html.xpath(body.html, '//a').nodes,
          // specific green color used
          strings.icontains(.raw, "#00c880")
  )
  and any(html.xpath(body.html, '//h1').nodes,
          .display_text =~ "new login detected"
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "HTML analysis"
  - "Content analysis"
