name: "Service abuse: Statuspage callback scam"
description: "Detects inbound messages sent from statuspage.io's notification address where the body text is classified by an NLU model as containing callback scam intent with medium or high confidence, indicating the legitimate service is being leveraged to deliver a callback scam lure."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and sender.email.email == "noreply@statuspage.io"
  and any(ml.nlu_classifier(body.current_thread.text).intents,
          .name == "callback_scam" and .confidence != "low"
  )
attack_types:
  - "Callback Phishing"
tactics_and_techniques:
  - "Social engineering"
  - "Spoofing"
detection_methods:
  - "Natural Language Understanding"
  - "Sender analysis"
id: "b33aa489-a22e-572c-8166-f2b02aef8cb8"
