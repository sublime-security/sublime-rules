name: "PR# 5135 - Attachment: ZIP containing Office binary with embedded DLL"
description: "Detects inbound messages with a ZIP attachment that contains an office binary and an unknown DLL."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "zip"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "zip_office_bin_dll")
          )
  )
attack_types:
  - "Malware/Ransomware"
tactics_and_techniques:
  - "Evasion"
detection_methods:
  - "Archive analysis"
  - "File analysis"
  - "YARA"
id: "4661427c-b5f0-5a4d-83b3-5de680b8d30f"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5135