name: "PR# 5570 - Link: Google Cloud Storage with base64 go/sub-ID fragment"
description: "Detects Google Cloud Storage links whose fragment is a base64 encoded affiliate query (go, s1, s2, s3) carrying a click/unsubscribe flag and per-recipient ID. Observed in free kit and parcel delivery spam."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          .href_url.domain.domain == "storage.googleapis.com"
          // base64 tracking query hidden in the fragment (go=1 click, go=2 unsubscribe)
          and regex.imatch(strings.decode_base64(.href_url.fragment[1:],
                                                 ignore_padding=true
                           ),
                           'go=[12]&s1=\d+&s2=\d+&s3=[a-z]+'
          )
  )
attack_types:
  - "Spam"
tactics_and_techniques:
  - "Free file host"
  - "Social engineering"
  - "Evasion"
detection_methods:
  - "URL analysis"
id: "8d668813-3040-5618-bfb2-1d23013e2253"
tags:
