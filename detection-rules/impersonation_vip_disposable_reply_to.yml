name: "Impersonation: VIP display name with disposable reply-to"
description: "Flags inbound messages where the sender's display name or subject line contains the display name of a known VIP, while the reply-to address uses a domain associated with disposable email providers. This pattern is commonly used to impersonate executives or other high-profile individuals while routing replies to throwaway accounts controlled by the attacker."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any($org_vips,
          strings.icontains(sender.display_name, .display_name)
          or strings.icontains(subject.base, .display_name)
  )
  and any(headers.reply_to,
          (
            .email.domain.root_domain in $disposable_email_providers
            or .email.domain.root_domain in $disposable_email_providers
          )
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "Impersonation: VIP"
  - "Free email provider"
  - "Social engineering"
detection_methods:
  - "Header analysis"
  - "Content analysis"
  - "Sender analysis"
id: "9dcacff8-328f-58c9-ac6f-6672cd2c324f"
