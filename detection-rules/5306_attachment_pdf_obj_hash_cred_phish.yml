name: "PR# 5306 - Attachment: PDF object hash cred phish"
description: "Detects inbound emails containing PDF attachments whose embedded objects match known malicious object hashes observed in cred phish PDFs."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              .scan.pdf_obj_hash.object_hash in (
                "c515d2cb8f93b87bc4891a411ab37e6d",
                "a67f29d92dd43a924218dc6a437c13d6"
              )
          )
  )
attack_types:
  - "Malware/Ransomware"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
  - "Threat intelligence"
id: "ffb72a59-765f-5ffa-a6ef-a99f93d6d1e3"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5306