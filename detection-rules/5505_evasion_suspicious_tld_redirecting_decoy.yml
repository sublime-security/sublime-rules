name: "PR# 5505 - Evasion: Suspicious TLD link redirecting to decoy destination"
description: "Flags inbound messages containing links with domains registered under suspicious top-level domains that redirect to a decoy page when analyzed. This behavior indicates the link is detecting automated sandbox or security analysis tools and serving benign content to evade detection, while likely delivering malicious content to real users."
type: "rule"
severity: "low"
source: |
  type.inbound
  and any(body.current_thread.links,
          .href_url.domain.tld in $suspicious_tlds
          and ml.link_analysis(.).effective_url.url in (
            'https://www.wikipedia.org/',
            'https://www.google.com/'
          )
  )
attack_types:
  - "Credential Phishing"
  - "Spam"
tactics_and_techniques:
  - "Evasion"
  - "Open redirect"
detection_methods:
  - "URL analysis"
id: "1f91b827-afd0-5637-9194-316fe8fd49d3"
tags:
  - created_from_open_prs
  - rule_status_renamed
  - pr_author_D-Bolton
references:
