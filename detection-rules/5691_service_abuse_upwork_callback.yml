name: "PR# 5691 - Service abuse: Upwork callback scam"
description: "Detects inbound messages sent from Upwork's root domain where NLU classification of the thread body identifies callback scam intent with medium or high confidence, indicating the platform is being abused to lure recipients into calling a fraudulent number."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and sender.email.domain.root_domain == "upwork.com"
  and any(ml.nlu_classifier(body.current_thread.text).intents,
          .name == "callback_scam" and .confidence != "low"
  )
attack_types:
  - "Callback Phishing"
tactics_and_techniques:
  - "Social engineering"
  - "Out of band pivot"
detection_methods:
  - "Natural Language Understanding"
  - "Sender analysis"
id: "30df860e-b638-533a-b0b0-e3c44f45b3f4"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_JFarina5
references:
