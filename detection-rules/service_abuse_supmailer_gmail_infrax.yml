name: "Service abuse: Supmailer sent via Gmail infrastructure"
description: "Detects inbound messages where the mailer header matches 'supmailer*' and the message originates from or is routed through Gmail infrastructure, either via the first hop server being smtp.gmail.com or the return path domain resolving to gmail.com or googlemail.com. This pattern indicates abuse of a third-party mailer service leveraging Gmail's sending infrastructure."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and strings.ilike(headers.mailer, "supmailer*")
  and (
    any(headers.hops, .index == 0 and .received.server.raw == "smtp.gmail.com")
    or headers.return_path.domain.root_domain in ("gmail.com", "googlemail.com")
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "Free email provider"
detection_methods:
  - "Header analysis"
