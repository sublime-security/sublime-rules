name: "PR# 5953 - Link: Google Cloud Storage project bucket hosted HTML page"
description: "Detects inbound messages containing links to storage.googleapis.com or storage.cloud.google.com whose path points to a top-level HTML object in a Firebase Storage (*.firebasestorage.app) or App Engine (*.appspot.com) project bucket, a pattern used to abuse trusted Google infrastructure for hosting malicious pages."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          .href_url.domain.domain in (
            "storage.googleapis.com",
            "storage.cloud.google.com"
          )
          // /<project>[.]firebasestorage[.]app/<object>[.]html
          // or /<project>[.]appspot[.]com/<object>[.]html
          and regex.imatch(.href_url.path,
                           '/[^/]+\.(?:firebasestorage\.app|appspot\.com)/[^/]+\.s?html?'
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Free file host"
  - "Evasion"
detection_methods:
  - "URL analysis"
id: "fe523da6-6b0c-5dec-816a-672594a82865"
