name: "Attachment: PDF USDOC ITA signature lure"
description: "Flags inbound messages containing PDF attachments that match a YARA rule looking for signature overlaps in observed USDOC ITA lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches,
                  .name == "pdf_ITA_signature_lure"
              )
          )
  )
attack_types:
  - "Credential Phishing"
  - "Malware/Ransomware"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
  - "YARA"
