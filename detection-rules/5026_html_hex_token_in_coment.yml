name: "PR# 5026 - Body HTML: Comment with 24-character hex token"
description: "Detects messages containing HTML comments with exactly 24 hexadecimal characters, which may indicate tracking tokens, session identifiers, or other suspicious embedded data used for evasion or tracking purposes."
type: "rule"
severity: "low"
source: |
  type.inbound
  and any(html.xpath(body.html, '//comment()').nodes,
          regex.imatch(.raw, '<!--\s*[a-f0-9]{24}\s*-->')
  )
  and not (
    sender.email.domain.root_domain in $high_trust_sender_root_domains
    and coalesce(headers.auth_summary.dmarc.pass, false)
  )
  and any(ml.nlu_classifier(body.current_thread.text).intents,
          .name in ("cred_theft", "bec") and .confidence != 'low'
  )
tags:
  - "Attack surface reduction"
  - pr_author_IndiaAce
  - created_from_open_prs
  - rule_status_modified
attack_types:
  - "Spam"
tactics_and_techniques:
  - "Evasion"
detection_methods:
  - "Content analysis"
  - "HTML analysis"
id: "d760657e-6570-54bc-a4d2-d3a1ad2d3b2a"
references:
