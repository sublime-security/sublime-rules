name: "PR# 5075 - URL with Unicode U+2044 (⁄) or U+2215 (∕) characters"
description: |
  Body of the message, or any links, contain the Unicode U+2044 (⁄) or U+2215 (∕) characters inside a URL.
type: "rule"
severity: "low"
authors:
  - twitter: "delivr_to"
references:
  - https://medium.com/@bobbyrsec/the-dangers-of-googles-zip-tld-5e1e675e59a5
  - https://github.com/sublime-security/sublime-rules/pull/5075
source: |
  type.inbound
  and (
    regex.icontains(body.plain.raw,
                    'https?:\/\/[^\s⁄∕]+(?:\/[^\s⁄∕]+)*[⁄∕][^\s⁄∕]+'
    )
    or any(body.links, strings.contains(.href_url.url, '⁄', '∕'))
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Evasion"
  - "Social engineering"
detection_methods:
  - "Content analysis"
  - "URL analysis"
id: "9fd40a82-e4e5-57b8-871e-2e463781b62b"
tags:
  - created_from_open_prs
  - rule_status_modified
  - pr_author_hugh-sublime