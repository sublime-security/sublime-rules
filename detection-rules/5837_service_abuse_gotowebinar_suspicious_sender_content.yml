name: "PR# 5837 - Service abuse: GoToWebinar with suspicious sender or content"
description: "Detects messages sent through legitimate GoToWebinar infrastructure where the webinar organizer or reply-to address shows signs of abuse, such as free email providers, newly registered domains, suspicious TLDs, mismatched reply-to addresses, or references to external meeting services like Microsoft Teams, Zoom, etc. This pattern indicates an actor is leveraging the trusted GoToWebinar platform to deliver fraudulent meeting invites while concealing their true identity."
type: "rule"
severity: "medium"
source: |
  type.inbound
  // sent via legitimate GoToWebinar infrastructure
  and sender.email.domain.root_domain == "gotowebinar.com"
  and (
    // GoToWebinar campaign header present and organizer is not GoTo
    (
      any(filter(flatten(map(headers.hops, .fields)),
                 strings.ilike(.name, "x-campaignid")
          ),
          strings.icontains(.value, "g2w")
      )
      and any(filter(flatten(map(headers.hops, .fields)),
                     strings.ilike(.name, "x-organizeremail")
              ),
              not regex.icontains(.value,
                                  '@(?:[a-z0-9-]+\.)?(?:gotowebinar|goto|logmein|gotomeeting)\.com'
              )
      )
    )
    // failsafe - headers missing, require a non-GoTo reply-to
    or (
      length(headers.reply_to) > 0
      and all(headers.reply_to,
              .email.domain.root_domain not in (
                "gotowebinar.com",
                "goto.com",
                "logmein.com",
                "gotomeeting.com",
                "getgo.com"
              )
      )
    )
    // failsafe - headers and reply-to missing, organizer from the unsubscribe/report-spam link is not GoTo
    or any(body.links,
           .href_url.domain.root_domain == "gotowebinar.com"
           and strings.ilike(.href_url.path,
                             "*subscription.tmpl",
                             "*reportSpam.tmpl"
           )
           and any(.href_url.query_params_decoded["organizerEmail"],
                   not regex.icontains(.,
                                       '@(?:[a-z0-9-]+\.)?(?:gotowebinar|goto|logmein|gotomeeting)\.com'
                   )
           )
    )
  )
  
  // suspicious signals
  and (
    // reply-to domain is suspicious (if present)
    any(headers.reply_to,
        .email.domain.tld in $suspicious_tlds
        or .email.domain.root_domain in $free_email_providers
        or network.whois(.email.domain).days_old < 30
    )
  
    // !!!!!!
    // reply-to profiles are discouraged here as the actor can control the reply-to address within the WTG service.
    // !!!!!!
  
    // extract organizer email from header if reply-to is missing
    or any(filter(flatten(map(headers.hops, .fields)),
                  strings.ilike(.name, "x-organizeremail")
           ),
           .value not in $recipient_emails
           // organizer email has no relationship with this org
           and (
             strings.parse_email(.value).domain.root_domain in $free_email_providers
             or (
               strings.parse_email(.value).domain.root_domain not in $org_domains
               and strings.parse_email(.value).domain.root_domain not in $recipient_domains
             )
           )
           and (
             (
               // mismatched event organizer and reply-to address (only when a reply-to exists)
               length(headers.reply_to) > 0
               and strings.parse_email(.value).domain.root_domain != headers.reply_to[0].email.domain.root_domain
             )
             // organizer email tld is suspicious
             or strings.parse_email(.value).domain.tld in $suspicious_tlds
             // organizer email sent from freemailer
             or strings.parse_email(.value).domain.root_domain in $free_email_providers
             // organizer email is new sender domain
             or network.whois(strings.parse_email(.value).domain).days_old < 30
           )
    )
    // failsafe - organizer from the unsubscribe/report-spam link if the header is missing
    or any(body.links,
           .href_url.domain.root_domain == "gotowebinar.com"
           and strings.ilike(.href_url.path,
                             "*subscription.tmpl",
                             "*reportSpam.tmpl"
           )
           and any(.href_url.query_params_decoded["organizerEmail"],
                   . not in $recipient_emails
                   // organizer has no relationship with this org
                   and (
                     strings.parse_email(.).domain.root_domain in $free_email_providers
                     or (
                       strings.parse_email(.).domain.root_domain not in $org_domains
                       and strings.parse_email(.).domain.root_domain not in $recipient_domains
                     )
                   )
                   and (
                     (
                       // mismatched event organizer and reply-to address (only when a reply-to exists)
                       length(headers.reply_to) > 0
                       and strings.parse_email(.).domain.root_domain != headers.reply_to[0].email.domain.root_domain
                     )
                     // organizer email tld is suspicious
                     or strings.parse_email(.).domain.tld in $suspicious_tlds
                     // organizer email sent from freemailer
                     or strings.parse_email(.).domain.root_domain in $free_email_providers
                     // organizer email is new sender domain
                     or network.whois(strings.parse_email(.).domain).days_old < 30
                   )
           )
    )
  
    // meeting invite referencing an external meeting service
    or regex.icontains(sender.display_name,
                       'google meet|(?:microsoft|ms).*teams|teams.*meeting|webex|zoom'
    )
    or any([subject.subject, body.current_thread.text],
           regex.icontains(.,
                           'google meet|microsoft teams|(?:teams|webex|zoom).meeting'
           )
    )
  )
attack_types:
  - "BEC/Fraud"
  - "Credential Phishing"
  - "Spam"
tactics_and_techniques:
  - "Social engineering"
  - "Free email provider"
  - "Spoofing"
  - "Impersonation: Brand"
detection_methods:
  - "Header analysis"
  - "Content analysis"
  - "URL analysis"
  - "Whois"
  - "Sender analysis"
