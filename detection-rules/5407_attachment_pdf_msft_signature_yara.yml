name: "PR# 5407 - Attachment: PDF including a Microsoft lure with specific signature"
description: "Detects inbound messages containing PDF attachments that match a YARA rule associated with Microsoft-themed lure content."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_msft_lure_signature")
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "6de97399-155d-5eec-b37f-c0c732dceb14"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
