name: "PR# 5676 - Attachment: PDF with guardbreak strings"
description: "Detects inbound messages containing PDF attachments that, contain strings commonly associated with attempts at guard breaking."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_suspect_guardbreak_strings")
          )
  )
attack_types:
  - "Malware/Ransomware"
tactics_and_techniques:
  - "PDF"
  - "Evasion"
detection_methods:
  - "File analysis"
  - "YARA"
id: "6cc4a2ac-4450-5d4d-9ee4-481a7656710c"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5676