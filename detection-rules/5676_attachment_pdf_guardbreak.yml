name: "Attachment: PDF with guardbreak strings"
description: "Detects inbound messages containing PDF attachments that, contain strings commonly associated with attempts at guard breaking."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_suspect_guardbreak_strings")
          )
  )
attack_types:
  - "Malware/Ransomware"
tactics_and_techniques:
  - "PDF"
  - "Evasion"
detection_methods:
  - "File analysis"
  - "YARA"
id: "6cc4a2ac-4450-5d4d-9ee4-481a7656710c"
og_id: "40900885-975c-5f9e-9a62-750f6ced8e93"
