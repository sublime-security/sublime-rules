name: "Service abuse: Google callback scam"
description: "Detects inbound messages spoofing Google's no-reply notification address where the body content is classified by the NLU engine as having callback scam intent with medium or high confidence."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and sender.email.email == "no-reply@accounts.google.com"
  and any(ml.nlu_classifier(body.current_thread.text).intents,
          .name == "callback_scam" and .confidence != "low"
  )
attack_types:
  - "Callback Phishing"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "Spoofing"
  - "Social engineering"
detection_methods:
  - "Natural Language Understanding"
  - "Sender analysis"
id: "1d1c3273-6735-57ed-a1e6-b1ac988bfc7d"
