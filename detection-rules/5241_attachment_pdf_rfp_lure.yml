name: "PR# 5241 - Attachment: PDF RFP lure"
description: "Detects inbound messages with PDF attachments that match a YARA signature identifying RFP-themed lure documents with a specific black and white lure."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_rfp_bw_lure")
          )
  )
attack_types:
  - "Credential Phishing"
  - "BEC/Fraud"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "1251e2de-0bb8-5005-9e62-7b0231c41def"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5241