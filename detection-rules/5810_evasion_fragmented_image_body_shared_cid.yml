name: "Evasion: Fragmented image body via shared CID hash"
description: "Detects inbound messages whose visible body is nearly empty while the HTML references four or more embedded images that share the same content-ID base hash, differing only by index. This is the fingerprint of a single image sliced into multiple tiles and reassembled via an HTML table layout, an evasion technique that hides the message content from text and URL based scanning while rendering as one coherent image to the recipient."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(regex.iextract(body.html.raw, 'cid:([a-f0-9]{16,})\.\d{1,3}@'),
          length(filter(html.xpath(body.html, '//img/@src').nodes,
                        strings.icontains(.raw, ..groups[0])
                 )
          ) >= 4
  )
  and length(coalesce(body.html.display_text, "")) < 150
attack_types:
  - "Credential Phishing"
  - "Callback Phishing"
tactics_and_techniques:
  - "Image as content"
  - "Social engineering"
detection_methods:
  - "HTML analysis"
  - "Content analysis"
