name: "PR# 5468 - Link: Newly registered suspicious domain with single-character HTML filename"
description: "Detects inbound emails containing links where the URL path ends in a single-character HTML filename, the domain uses a suspicious top-level domain, and the domain was registered fewer than 30 days ago. This combination of indicators is commonly associated with rapidly deployed phishing kits hosted on freshly registered infrastructure."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.current_thread.links,
          regex.icontains(.href_url.path, '/[^/]\.html')
          and .href_url.domain.tld in $suspicious_tlds
          and network.whois(.href_url.domain).days_old < 30
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Evasion"
  - "Social engineering"
detection_methods:
  - "URL analysis"
  - "Whois"
id: "f9deac97-28b5-5cdf-9fef-c4ccadf3c448"
tags:
  - created_from_open_prs
