name: "Link: Credential phishing via appspot.com hosting"
description: "Detects inbound messages containing a link hosted on an appspot.com subdomain, with credential theft intent in the message body. Trusted sender domains are excluded unless they fail DMARC authentication."
type: "rule"
severity: "medium"
source: |
  type.inbound
  // link is a PaaS hosting appspot.com domain
  and any(body.current_thread.links,
          strings.ends_with(.href_url.domain.domain, ".r.appspot.com")
  )
  
  // cred theft present
  and any(ml.nlu_classifier(body.current_thread.text).intents,
          .name == "cred_theft"
  )
  
  // negate highly trusted sender domains unless they fail DMARC authentication
  and not (
    sender.email.domain.root_domain in $high_trust_sender_root_domains
    and coalesce(headers.auth_summary.dmarc.pass, false)
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Free subdomain host"
  - "Social engineering"
detection_methods:
  - "URL analysis"
  - "Natural Language Understanding"
  - "Header analysis"
