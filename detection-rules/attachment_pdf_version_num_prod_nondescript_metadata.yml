name: "Attachment: PDF with version-only producer and default, anonymized or missing metadata"
description: "Detects PDF attachments whose EXIF producer field contains only a version string (no software or product name) combined with default, anonymized or missing metadata—untitled document, anonymous creator/author, and unspecified subject—and embedded OCR text prompting the recipient to open the document. This combination of an unnamed generation tool, placeholder/missing metadata, and an open-document lure prompt is characteristic of automated PDF-generation kits used in credential phishing and BEC lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(attachments,
          .file_type == "pdf"
          //
          // This rule makes use of a beta feature and is subject to change without notice
          // using the beta feature in custom rules is not suggested until it has been formally released
          //
          and any([beta.parse_exif(.)],
                  regex.imatch(.producer, '[\d.\s()]*\d[\d.\s()]*')
                  // placeholder or blank document info... exiftool returns "" for absent keys,
                  // so a stripped info dict satisfies every arm
                  and 2 of (
                    .title in~ ("untitled", ""),
                    .creator in~ ("anonymous", ""),
                    .author in~ ("anonymous", ""),
                    (
                      any(.fields, .key == "Subject" and .value =~ "unspecified")
                      or not any(.fields, .key == "Subject" and .value != "")
                    )
                  )
          )
          and regex.icontains(beta.ocr(.).text,
                              '\bopen(?:s|ed|ing)?\b[\s\S]{0,30}document'
          )
  )
attack_types:
  - "BEC/Fraud"
  - "Credential Phishing"
tactics_and_techniques:
  - "Image as content"
  - "Social engineering"
  - "Evasion"
detection_methods:
  - "Exif analysis"
  - "Optical Character Recognition"
  - "Content analysis"
id: "40f73aea-39cf-5a36-a9bc-267bdf0f7cfc"
