name: "Attachment: PDF W9 form signature bytes"
description: "Detects inbound messages containing PDF attachments that match YARA signature bytes associated with IRS W9 tax forms."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_w9_signature_bytes")
          )
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
  - "YARA"
id: "90939333-debc-58db-b107-03a0226d2a96"
