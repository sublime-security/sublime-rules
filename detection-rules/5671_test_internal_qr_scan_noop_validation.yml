name: "TEST - internal.qr_scan no-op validation"
description: "Test rule that calls internal.qr_scan on each inbound image attachment to validate alternative QR scanning. Rule will never flag, as items clause cannot be fulfilled"
type: "rule"
severity: "low"
source: |
  type.inbound
  and any(attachments,
          .file_type in $file_types_images
          // calls internal.qr_scan on each image attachment, but the
          // comparison can never be true -> rule never flags.
          // length() on an empty/null array returns 0, so < 0 is unsatisfiable.
          and length(internal.qr_scan(.).items) < 0
  )
tactics_and_techniques:
  - "Image as content"
  - "QR code"
detection_methods:
  - "File analysis"
id: "e9b162f5-7f9a-552f-a634-6ad17bf986da"
og_id: "c20fcaae-0e46-5ffc-8a5d-2ffd70e404ff"
