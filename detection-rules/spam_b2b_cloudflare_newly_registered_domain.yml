name: "Spam: Cold outreach from Cloudflare-hosted newly registered domain"
description: "Flags inbound messages from sender domains that were registered fewer than 70 days ago and use exactly two Cloudflare name servers with subdomains ending in '.ns'. The rule further requires that the subject or body text be classified as B2B cold outreach by the NLU model, that the body be short (under 350 characters), and that the sender's TLD not be on the suspicious TLD list, indicating abuse of Cloudflare's free DNS infrastructure to rapidly stand up new domains for outreach-style spam."
type: "rule"
severity: "low"
source: |
  type.inbound
  // newly registered sender domain
  and network.whois(sender.email.domain).days_old < 70
  // there are 2 name servers which have subdomains ending with .ns
  and length(network.whois(sender.email.domain).name_servers) == 2
  and all(network.whois(sender.email.domain).name_servers,
          strings.iends_with(.subdomain, '.ns')
          and .root_domain == 'cloudflare.com'
  )
  and any([subject.base, body.current_thread.text],
          (any(ml.nlu_classifier(.).topics, .name == 'B2B Cold Outreach'))
  )
  and length(body.current_thread.text) < 350
  and not sender.email.domain.tld in $suspicious_tlds
attack_types:
  - "Spam"
tactics_and_techniques:
  - "Evasion"
  - "Social engineering"
detection_methods:
  - "Whois"
  - "Natural Language Understanding"
  - "Content analysis"
id: "ce0a2f77-7dbb-52d7-9e16-6c6ac854b783"
