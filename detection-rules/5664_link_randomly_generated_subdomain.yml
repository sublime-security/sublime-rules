name: "PR# 5664 - Link: Randomly generated subdomain"
description: "Identifies inbound messages containing links where the subdomain follows a pattern of letters combined with a long hexadecimal string, a hallmark of auto-generated or algorithmically created hosting infrastructure often used to evade detection."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.current_thread.links,
          regex.imatch(.href_url.domain.subdomain, '[a-z]{3,30}[0-9a-f]{32}')
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Evasion"
detection_methods:
  - "URL analysis"
id: "f247894a-b350-5666-abf8-f59f69822a96"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_IndiaAce
references:
  - https://github.com/sublime-security/sublime-rules/pull/5664