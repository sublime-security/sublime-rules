name: "Impersonation: SAM/SBA federal registration"
description: "Detects inbound messages impersonating SAM.gov or the Small Business Administration by matching sender display names against known spoofed naming patterns (e.g. sba-support, sam registration/renewal) or by identifying sam.gov references paired with an embedded 'renew entity' image lure. Legitimate senders from verified sba.gov, sam.gov, or other high-trust domains that pass DMARC authentication are excluded."
type: "rule"
severity: "high"
source: |
  type.inbound
  and (
    regex.icontains(sender.display_name,
                    '^sam(?:\.gov\b|\s(?:renew|compliance))',
                    'final\ssam\.gov',
                    '^sba[\s-]?(?:e[fd]|\.gov)',
                    '^sba[\s-](?:connect|invoice|admin|eidl)\b',
                    '^sba[\s-]support[\s-]\w+'
    )
    or (
      strings.icontains(body.current_thread.text, 'sam.gov')
      and any(html.xpath(body.html, '//img/@src').nodes,
              strings.icontains(.raw, 'sam%20renew%20entity')
      )
    )
    // cred theft or callback related
    or (
      strings.icontains(body.current_thread.text, "sam registration")
      and any(body.links, .href_url.domain.root_domain != "sam.gov")
      and any(ml.nlu_classifier(body.current_thread.text).intents,
              .name in ("cred_theft", "callback_scam") and .confidence != "low"
      )
    )
    // email body containing sam renewal information
    or (
      3 of (
        strings.icontains(body.current_thread.text, "sam account"),
        strings.icontains(body.current_thread.text, "sam registration"),
        strings.icontains(body.current_thread.text, "annual renewal"),
        strings.icontains(body.current_thread.text, "company"),
        strings.icontains(body.current_thread.text, "cage code"),
        strings.icontains(body.current_thread.text, "uei")
      )
      // any links under 120 days - most have been found which does not resolve
      and any(body.links, network.whois(.href_url.domain).days_old <= 120)
    )
  )
  // negate legitimate senders or domains associated with sam.gov
  and not (
    (
      sender.email.domain.root_domain in ("dla.mil", "govly.com")
      or sender.email.domain.root_domain in $high_trust_sender_root_domains
    )
    and coalesce(headers.auth_summary.dmarc.pass, false)
  )
attack_types:
  - "Credential Phishing"
  - "BEC/Fraud"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "Social engineering"
  - "Image as content"
detection_methods:
  - "Sender analysis"
  - "Content analysis"
  - "HTML analysis"
  - "Header analysis"
