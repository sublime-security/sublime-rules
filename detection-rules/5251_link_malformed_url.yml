name: "PR# 5251 - Link: Malformed protocol-relative URL"
description: "Detects inbound emails containing malformed links."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          strings.starts_with(.href_url.path, '//')
          and .href_url.domain.domain is null
          and regex.contains(.href_url.path, './/.')
          and regex.contains(.href_url.path, '[^/]/')
  )
tags:
  - "Attack surface reduction"
  - pr_author_keaton-sublime
  - created_from_open_prs
  - rule_status_added
attack_types:
  - "Malware/Ransomware"
tactics_and_techniques:
  - "Evasion"
detection_methods:
  - "URL analysis"
id: "5500917b-b388-5f8f-8b2c-6933d94c44d1"
references:
