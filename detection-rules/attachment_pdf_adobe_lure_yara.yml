name: "Attachment: PDF Adobe lure"
description: "Detects inbound messages containing PDF attachments that match a YARA signature identifying Adobe-themed lure content."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_red_adobe_lure")
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "119a4574-9bad-52fb-9033-277ec5c9ee0f"
