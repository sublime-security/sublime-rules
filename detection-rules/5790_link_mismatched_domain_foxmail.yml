name: "Link: Mismatched hyperlink with randomized domain via Foxmail"
description: "Detects inbound messages sent using the Foxmail mail client that contain mismatched hyperlinks, where the displayed link text does not match the actual destination URL. The underlying domain and path consist of short, randomized alphanumeric strings often associated with phishing infrastructure or URL redirection services. Messages classified as advertising or promotional content by the NLU model are excluded to reduce false positives."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.current_thread.links,
          .mismatched
          and regex.imatch(.href_url.domain.sld, '[a-z0-9]{4,7}')
          and regex.match(.href_url.path, '/[A-Za-z0-9]{5,8}')
  )
  and strings.icontains(headers.mailer, 'foxmail')
  and not any(ml.nlu_classifier(body.current_thread.text).topics,
              .name == "Advertising and Promotions"
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Social engineering"
  - "Evasion"
detection_methods:
  - "URL analysis"
  - "Header analysis"
  - "Natural Language Understanding"
