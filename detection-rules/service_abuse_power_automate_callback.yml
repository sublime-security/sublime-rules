name: "Service abuse: Power Automate callback scam"
description: "Detects inbound messages sent from Power Automate's notification address where the message body is classified by an NLU model as containing callback scam intent with medium or high confidence, indicating abuse of the legitimate automation service to deliver callback scam content."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and sender.email.email == "powerautomatenoreply@microsoft.com"
  and any(ml.nlu_classifier(body.current_thread.text).intents,
          .name == "callback_scam" and .confidence != "low"
  )
attack_types:
  - "Callback Phishing"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Natural Language Understanding"
  - "Sender analysis"
