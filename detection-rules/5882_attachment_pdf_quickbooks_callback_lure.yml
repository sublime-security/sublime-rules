name: "PR# 5882 - Attachment: PDF QuickBooks callback lure"
description: "Detects inbound messages containing a PDF attachment that matches a YARA signature identifying a QuickBooks-themed callback phishing lure."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches,
                  .name == "pdf_quickbooks_toad_lure_blank_page"
              )
          )
  )
attack_types:
  - "Callback Phishing"
tactics_and_techniques:
  - "PDF"
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "File analysis"
  - "YARA"
id: "e8297ea2-7000-5c4e-9ca1-0809a12a3004"
tags:
  - created_from_open_prs
  - rule_status_renamed
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5882