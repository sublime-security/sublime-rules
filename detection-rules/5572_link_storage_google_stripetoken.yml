name: "Link: Google Cloud Storage with case-striped tracking token in fragment"
description: "Detects Google Cloud Storage links whose fragment carries an affiliate click token of digit fields split by fixed-length lowercase and uppercase filler runs, led by a click/unsubscribe digit. Observed in free kit, gift card and account suspension spam."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          .href_url.domain.domain == "storage.googleapis.com"
          // link type digit (4 = click, 5 = unsubscribe), then digit fields split by fixed-length letter filler
          and regex.contains(.href_url.fragment,
                             '(?:^|/)[45][A-Za-z]{5}\d+[A-Za-z]{4}\d+[a-z]{10}\d+[A-Z]{15}\d+[A-Z]{4}\d+[A-Za-z]\d+(?:$|[/?])'
          )
  )
attack_types:
  - "Spam"
tactics_and_techniques:
  - "Free file host"
  - "Evasion"
detection_methods:
  - "URL analysis"
id: "de31dff3-b3f8-5672-a55c-ac0fdae82d55"
og_id: "940836a5-288c-57a0-9521-5dd612014299"
