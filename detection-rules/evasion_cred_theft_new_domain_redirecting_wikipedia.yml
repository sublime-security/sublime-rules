name: "Evasion: Credential phishing with newly registered domain redirecting to Wikipedia"
description: "Flags inbound messages where natural language understanding detects credential theft intent in the message body, combined with a link pointing to a domain registered within the last 30 days that resolves to Wikipedia, indicating evasion of link analysis through a benign-looking redirect destination."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(ml.nlu_classifier(body.current_thread.text).intents,
          .name == 'cred_theft' and .confidence != 'low'
  )
  and any(body.current_thread.links,
          network.whois(.href_url.domain).days_old < 30
          and ml.link_analysis(.).effective_url.url in (
            'https://www.wikipedia.org/'
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Evasion"
  - "Social engineering"
detection_methods:
  - "Natural Language Understanding"
  - "URL analysis"
  - "Whois"
id: "ae1f1fa1-bd08-571a-bf8a-18fafc73c064"
