name: "Impersonation: Fictitious invoice using LinkedIn's address"
description: "Detects fraudulent invoices referencing LinkedIn's corporate address (1000 W. Maude Ave) either pasted directly into the message body or rendered as a PDF attachment generated by tools such as wkhtmltopdf, Qt, or Skia. Uses an NLU classifier to confirm the message is an invoice and relates to financial communications, while excluding legitimate messages that pass DMARC from LinkedIn or licdn.com domains."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and (
    // invoice pasted directly into the message body
    (
      regex.icontains(body.current_thread.text, '1000 W(?:est)?\.? Maude Ave')
      and any(ml.nlu_classifier(body.current_thread.text).tags,
              .name == "invoice"
      )
    )
    // or rendered as a PDF attachment
    or (
      0 < length(filter(attachments, .file_type == "pdf")) < 3
      and any(filter(attachments,
                     .file_type == "pdf"
                     // creator and producer of PDF seen in malicious content
                     and (
                       strings.starts_with(beta.parse_exif(.).creator,
                                           "wkhtmltopdf"
                       )
                       or strings.starts_with(beta.parse_exif(.).producer,
                                              "Qt ",
                                              "Skia"
                       )
                     )
              ),
              any(filter(file.explode(.), .scan.ocr.raw is not null),
                  regex.icontains(.scan.ocr.raw, '1000 W(?:est)?\.? Maude Ave')
              )
      )
    )
  )
  // not actually from LinkedIn
  and not (
    sender.email.domain.root_domain in ("linkedin.com", "licdn.com")
    and coalesce(headers.auth_summary.dmarc.pass, false)
  )
  and any(ml.nlu_classifier(body.current_thread.text).topics,
          .name == "Financial Communications" and .confidence != "low"
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "PDF"
  - "Social engineering"
detection_methods:
  - "File analysis"
  - "Optical Character Recognition"
  - "Natural Language Understanding"
  - "Content analysis"
  - "Exif analysis"
id: "aeee3d9f-4b34-5b56-9ac7-81dc3d344489"
