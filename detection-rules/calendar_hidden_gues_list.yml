name: "ICS phishing: Hidden guest list calendar invite"
description: "Detects inbound messages containing a calendar (.ics) attachment where the invite text indicates the guest list has been hidden at the organizer's request. This tactic is commonly used to obscure the true sender or recipients of a meeting invite, making it harder for recipients to verify legitimacy. The rule further validates suspicion by confirming the message content was not classified as benign by the NLU model."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and strings.icontains(body.current_thread.text,
                        "(Guest list has been hidden at organizer's request)"
  )
  and any(attachments,
          (
            .file_type == "ics"
            or .file_extension == "ics"
            or .content_type in ("application/ics", "text/calendar")
          )
  )
  and not any(ml.nlu_classifier(body.current_thread.text).intents,
              .name == 'benign'
  )
tags:
  - "Attack surface reduction"
attack_types:
  - "Credential Phishing"
  - "Spam"
tactics_and_techniques:
  - "ICS Phishing"
  - "Social engineering"
detection_methods:
  - "Content analysis"
  - "File analysis"
  - "Natural Language Understanding"
