name: "PR# 5422 - Reconnaissance: Numeric-hex reference code subject"
description: "Detects inbound messages whose subject contains a structured reference-code identifier (a hash mark, 8-digit number, hyphen, and 8-character hex string, e.g. #12345678-abcdef12). The official-looking reference number is a response-elicitation tactic to confirm the mailbox is live, monitored, and opening a thread for further social engineering."
type: "rule"
severity: "low"
source: |
  type.inbound
  and regex.imatch(subject.base, '#\d{8}-[a-f0-9]{8}\b')
attack_types:
  - "BEC/Fraud"
  - "Spam"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Header analysis"
id: "21018ced-ef17-5bc7-accd-ef70d5184828"
tags:
