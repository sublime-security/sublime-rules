name: "PR# 5480 - Link: Google share.google URL shortener in google.<tld>/share.google path form"
description: "Detects inbound messages with body links in the form google.<tld>/share.google?q=<code>, which inherits google.<tld> domain reputation to mask an attacker-controlled destination. This google.<tld>/share.google?q= path form is undocumented: Google publishes the share.google shortener feature, but not this on-Google-domain form or its 'q' parameter."
type: "rule"
severity: "medium"
source: |
  // note to rule writers
  // this rule has related rules which cover the same logic, but this one handles links in the message body
  // very likely the logic will need updated in the corresponding rules
  // see attachment_google_share_google_link.yml and attachment_ics_google_share_google_link.yml
  type.inbound
  and any(body.links,
          .href_url.domain.sld == "google"
          and strings.istarts_with(.href_url.path, '/share.google')
          and 'q' in keys(.href_url.query_params_decoded)
  )
attack_types:
  - "Spam"
  - "Credential Phishing"
tactics_and_techniques:
  - "Open redirect"
  - "Social engineering"
detection_methods:
  - "URL analysis"
  - "Content analysis"
id: "da826fbd-1bbb-5736-8e26-ae49322ccd53"
tags:
