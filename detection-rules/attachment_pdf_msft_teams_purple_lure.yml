name: "Attachment: Microsoft Teams Planner PDF lure"
description: "Detects inbound messages containing PDF attachments that match a YARA signature identifying a Microsoft Teams Planner purple-themed lure."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches,
                  .name == "pdf_msft_teams_planner_purple_lure",
              )
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "PDF"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "d619e179-3016-52e1-b6de-446bb2331d8f"
