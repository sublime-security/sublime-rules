name: "PR# 5938 - Attachment: PDF with 'open document' lure text"
description: "Detects inbound emails containing exactly one PDF attachment whose extracted OCR text includes the phrases 'open document' and '.pdf' as part of the lure."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and length(filter(attachments, .file_type == "pdf")) == 1
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              .depth == 1
              and strings.icontains(.scan.ocr.raw, "open document")
              and strings.icontains(.scan.ocr.raw, ".pdf")
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "Optical Character Recognition"
  - "File analysis"
  - "Content analysis"
id: "b453e9a9-fb07-5dda-b1fe-2233c032be6f"
tags:
