name: "Attachment: Suspicious Office 365 app authorization (OAuth) link"
description: "Detects inbound messages whose PDF, HTML, DOCX, or PPTX attachments contain a suspicious Office 365 app authorization (OAuth) link. The app may be compromised or was stood up for malicious purposes. Once the app has been authorized, the attacker will have read or write permissions to the user's Office 365 account. ICS and EML attachments are covered by separate rules."
references:
  - "https://info.phishlabs.com/blog/office-365-phishing-uses-malicious-app-persist-password-reset"
type: "rule"
severity: "high"
source: |
  // note to rule writers
  // this rule has related rules which cover the same logic, but this one handles links inside PDF, HTML, DOCX, and PPTX attachments
  // very likely the logic will need updated in the corresponding rules
  // see link_office365_suspicious_app_authorization.yml, attachment_ics_link_office365_suspicious_app_authorization.yml, and attachment_eml_link_office365_suspicious_app_authorization.yml
  type.inbound
  and any(filter(attachments, .file_type in ("pdf", "html", "docx", "pptx")),
          any(file.explode(.),
              any(.scan.url.urls,
                  .domain.domain == 'login.microsoftonline.com'
                  and (
                    strings.ilike(.query_params,
                                  '*offline_access*',
                                  '*.readwrite*',
                                  '*.read*',
                                  '*ctx=*',
                                  '*prompt=none*'
                    )
                    or (
                      strings.icontains(.path, '/common/reprocess')
                      and strings.icontains(.query_params, 'ctx=')
                      and strings.icontains(.query_params, 'sessionId=')
                    )
                  )
              )
          )
  )
attack_types:
  - "Credential Phishing"
detection_methods:
  - "URL analysis"
id: "b25398fa-42c6-5add-a9ee-f1f1ed586447"
