name: "PR# 5649 - Extortion: Tox messenger ID"
description: "Flags inbound messages where NLU classification identifies extortion or credential theft intent with medium or high confidence, and the message body references the Tox or qTox messaging application alongside a 76-character hexadecimal string matching the Tox ID format. This pattern is commonly used in extortion scams where attackers direct victims to continue communication over Tox to evade detection."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(ml.nlu_classifier(body.current_thread.text).intents,
          .name in ('extortion', 'cred_theft') and .confidence != 'low'
  )
  and regex.icontains(body.current_thread.text, '\bq?tox\b')
  and regex.contains(body.current_thread.text, '[0-9a-fA-F]{76}')
attack_types:
  - "Extortion"
tactics_and_techniques:
  - "Social engineering"
  - "Out of band pivot"
  - "Evasion"
detection_methods:
  - "Natural Language Understanding"
  - "Content analysis"
id: "d62e87f7-9f4e-584c-a8a0-41880397209a"
tags:
