name: "Link: Google Cloud Storage with short-path link delivery"
description: "Detects inbound messages containing links to Google Cloud Storage (storage.googleapis.com) where the URL path ends in 'ls', 'lis', or 'li', matching a pattern used to host redirector or landing pages. Observed across multilingual spam and unsolicited promotional messages — including fake parcel delivery notifications impersonating FedEx and T&T, as well as product advertisement lures — sent from a variety of compromised or unrelated sender domains. The consistent use of this specific GCS path pattern suggests a shared delivery infrastructure across multiple senders."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          .href_url.domain.domain == "storage.googleapis.com"
          // path ends with lis, ls, or li
          and regex.imatch(.href_url.path, '/[^/]+/(?:li|ls|lis)')
  )
attack_types:
  - "Spam"
  - "Credential Phishing"
tactics_and_techniques:
  - "Free file host"
  - "Evasion"
  - "Social engineering"
  - "Impersonation: Brand"
detection_methods:
  - "URL analysis"
  - "Content analysis"
