name: "Attachment: ICS calendar file with real estate fraud link"
description: "Detects calendar files (.ics files) whose parsed event content references real estate transaction documents such as closing disclosures, settlement statements, or 1099-S forms."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(attachments,
          (
            .file_type == "ics"
            or .file_extension == "ics"
            or .content_type in ("application/ics", "text/calendar")
          )
          //
          // This rule makes use of a beta feature and is subject to change without notice
          // using the beta feature in custom rules is not suggested until it has been formally released
          //
          and any(beta.file.parse_ics(.).events,
                  (
                    any([.summary, .description],
                        regex.icontains(.,
                                        'file attached',
                                        '\brefer\b',
                                        '\brespon(?:d|se)\b',
                                        '\breview\b'
                        )
                    )
                    or any(.links, regex.icontains(.display_text, 'view'))
                  )
                  and (
                    any([.summary, .description],
                        regex.icontains(., "1099-s", "draw settlement")
                    )
                    or (
                      any([.summary, .description],
                          regex.icontains(.,
                                          '(?:attached|buyer/seller|new|preliminary).closing disclosure',
                                          'settlement.(?:&|and.)?(?:report|statement)'
                          )
                      )
                      and length(body.current_thread.text) < 2000
                    )
                  )
          )
  )

attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "Social engineering"
  - "Evasion"
detection_methods:
  - "File analysis"
  - "Content analysis"
  - "URL analysis"
