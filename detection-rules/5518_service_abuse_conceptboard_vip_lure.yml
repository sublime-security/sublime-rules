name: "Service abuse: Conceptboard VIP impersonation lure"
description: "Detects inbound emails from conceptboard.com where the message body references an organizational VIP's display name paired with the phrase 'wants to work with you,' indicating the legitimate collaboration platform is being abused to impersonate a VIP and lure recipients into engaging with a fraudulent workspace invitation."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and sender.email.domain.root_domain == "conceptboard.com"
  and any($org_vips,
          strings.icontains(body.current_thread.text,
                            strings.concat(.display_name,
                                           " wants to work with you"
                            )
          )
  )
attack_types:
  - "BEC/Fraud"
  - "Spam"
tactics_and_techniques:
  - "Impersonation: VIP"
  - "Social engineering"
detection_methods:
  - "Content analysis"
  - "Sender analysis"
