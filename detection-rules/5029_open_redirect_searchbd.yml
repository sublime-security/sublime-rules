name: "Open redirect: searchbd.net"
description: "Detects inbound messages containing links that abuse searchbd.net as an open redirect. The rule identifies links where the recipient's email address is embedded in the URL and the redirect destination points away from searchbd.net rather than back to it, indicating the domain is being leveraged to disguise the true destination. Messages are excluded when the sender's domain is searchbd.net and passes DMARC authentication, filtering out legitimate use of the service."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          .href_url.domain.root_domain == "searchbd.net"
          and length(.href_url.query_params_decoded["url"]) > 0
          and strings.contains(.href_url.url, recipients.to[0].email.email)
          // redirect is not going back to searchbd.net
          and not any(.href_url.query_params_decoded["url"],
                      strings.parse_url(.).domain.root_domain == "searchbd.net"
          )
  )
  and not (
    sender.email.domain.root_domain == "searchbd.net"
    and coalesce(headers.auth_summary.dmarc.pass, false)
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Open redirect"
  - "Evasion"
detection_methods:
  - "URL analysis"
