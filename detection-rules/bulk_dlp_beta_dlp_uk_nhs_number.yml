name: "beta.DLP: NHS Number"
description: "Detects messages containing UK NHS numbers."
type: "dlp"
severity: "high"
source: |
  type.outbound
  and (
    any(beta.ml_extract_sensitive_information(body.current_thread.text).elements,
        .type == "uk_nhs_number" and .confidence in ("medium", "high")
    )
    or any(beta.ml_extract_sensitive_information(subject.subject).elements,
           .type == "uk_nhs_number" and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(beta.ml_extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "uk_nhs_number"
                     and .confidence in ("medium", "high")
                 )
                 or any(beta.ml_extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "uk_nhs_number"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
tags:
  - "Personal data"
  - "Health data"
  - "UK GDPR"
  - "UK"
attack_types:
  - "DLP: Personal data"
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "2258dfc7-ff4f-5084-a1e7-834ba5021df5"
og_id: "d074771e-e956-5a19-b7ba-a91bd841d8b7"
testing_pr: 0