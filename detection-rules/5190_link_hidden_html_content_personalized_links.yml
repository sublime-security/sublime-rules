name: "Evasion: Hidden text using CSS-obscured HTML option labels"
description: "Detects inbound messages containing HTML elements that are visually hidden through CSS techniques such as extreme negative z-index values or zero-sized dimensions, combined with <option> tags containing label attributes. This pattern is indicative of hidden text salting, where invisible or off-screen content is injected into the HTML body to manipulate content analysis engines and evade detection."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and (
    regex.icontains(body.html.raw,
                    'z-index:\s*-\d{3,}',
                    'width:\s*0;\s*height:\s*0'
    )
    and regex.icontains(body.html.raw, '<option[^>]{0,300}\blabel=')
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Evasion"
  - "Social engineering"
  - "Impersonation: Brand"
detection_methods:
  - "HTML analysis"
  - "URL analysis"
  - "Content analysis"
