name: "Link: Hex-encoded recipient email in URL fragment"
description: "Detects messages where a link in the body contains the recipient's email address hex-encoded in the URL fragment, a technique used to auto-populate or validate the target on a credential harvesting page. This pattern commonly appears in fake password expiration or account notice lures that direct victims to spoofed login pages pre-filled with their own address to increase credibility."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          strings.decode_hex(.href_url.fragment) == recipients.to[0].email.email
  )
tags:
  - "Attack surface reduction"
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Encryption"
  - "Evasion"
  - "Social engineering"
detection_methods:
  - "URL analysis"
  - "Content analysis"
