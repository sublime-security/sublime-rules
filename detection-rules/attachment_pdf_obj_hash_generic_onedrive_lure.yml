name: "Attachment: PDF Object Hash - Generic OneDrive lures"
description: "Detects inbound emails containing PDF attachments where an embedded object's hash matches a specific known object hash previously associated with OneDrive lures."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              .scan.pdf_obj_hash.object_hash == "6660a05ed00da8a0d1812eca2c993220"
          )
  )
attack_types:
  - "Malware/Ransomware"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
id: "1450bbc5-75b2-58cc-990b-304146536428"
