name: "PR# 5213 - HTML: Bidirectional (BIDI) HTML override with right to left obfuscation"
description: "Body HTML contains multiple instances of right-to-left (RTL) text direction override markup, which can be used to visually manipulate text display and potentially bypass common strings checks."
type: "rule"
severity: "medium"
source: |
  type.inbound
  // You should only observe RTL injection when RTL languages are present.
  and (
    regex.icount(body.html.raw, 'unicode-bidi\s*:\s*bidi-override[^>]*rtl') + regex.icount(body.html.raw,
                                                                                           '<bdo dir="rtl">'
    )
  // Count allows for scalability for FP's.
  ) >= 3
  // exclude legitimate CSS star-rating widgets
  and not regex.icontains(body.html.raw, '\.rating[^}]*:hover')

attack_types:
  - "BEC/Fraud"
  - "Credential Phishing"
tactics_and_techniques:
  - "Evasion"
  - "Social engineering"
  - "Scripting"
detection_methods:
