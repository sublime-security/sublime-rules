name: "PR# 5889 - Link: Google share.google URL shortener in undocumented redirect forms"
description: "Detects inbound messages with body links in either of two undocumented Google share.google redirect forms: google.<tld>/share.google?q=<code>, and share.google/?link=<url>. Both inherit Google domain reputation to mask an attacker-controlled destination. Google publishes the share.google shortener as a share.google/<code> path, but neither the on-Google-domain ‘q’ form nor the ‘link’ parameter form is documented."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          (
            .href_url.domain.sld == "google"
            and strings.istarts_with(.href_url.path, '/share.google')
            and 'q' in keys(.href_url.query_params_decoded)
          )
          or (
            .href_url.domain.root_domain == "share.google"
            and 'link' in keys(.href_url.query_params_decoded)
          )
  )
attack_types:
  - "Spam"
  - "Credential Phishing"
tactics_and_techniques:
  - "Open redirect"
  - "Social engineering"
detection_methods:
  - "URL analysis"
  - "Content analysis"
related_detections:
  - "attachment_google_share_google_link.yml"
  - "attachment_ics_google_share_google_link.yml"
id: "b0379f7e-c434-56cc-8752-15eec77c52b8"
