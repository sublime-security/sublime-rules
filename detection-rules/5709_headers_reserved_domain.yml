name: "PR# 5709 - Headers: Reserved domain in Message-ID"
description: "Detects inbound messages where the Message-ID header contains a reserved or placeholder domain (such as example.com/net/org or a subdomain ending in .test, .invalid, .example, or .localhost). These domains are set aside by RFC standards for documentation and testing purposes and should never appear in legitimate production mail headers, making their presence a strong indicator of spoofed or synthetically generated messages."
type: "rule"
severity: "low"
source: |
  type.inbound
  and regex.icontains(headers.message_id,
                      '@(?:example\.(?:com|net|org)|[^@]*\.(?:test|invalid|example|localhost))>?$'
  )
tags:
  - "Attack surface reduction"
  - pr_author_markmsublime
