name: "Link: Suspicious Office 365 app authorization (OAuth) link"
description: "Detects inbound messages with body links to a suspicious Office 365 app authorization (OAuth) request. The app may be compromised or was stood up for malicious purposes. Once the app has been authorized, the attacker will have read or write permissions to the user's Office 365 account."
references:
  - "https://info.phishlabs.com/blog/office-365-phishing-uses-malicious-app-persist-password-reset"
type: "rule"
severity: "high"
source: |
  // note to rule writers
  // this rule has related rules which cover the same logic, but this one handles links in the message body
  // very likely the logic will need updated in the corresponding rules
  // see attachment_link_office365_suspicious_app_authorization.yml, attachment_ics_link_office365_suspicious_app_authorization.yml, and attachment_eml_link_office365_suspicious_app_authorization.yml
  type.inbound
  and any([body.links, body.current_thread.links],
          any(.,
              (
                .href_url.domain.domain == 'login.microsoftonline.com'
                or strings.icontains(.href_url.query_params,
                                     "login.microsoftonline.com"
                )
              )
              and (
                strings.ilike(.href_url.query_params,
                              '*offline_access*',
                              '*.readwrite*',
                              '*.read*',
                              '*ctx=*',
                              '*prompt=none*'
                )
                or (
                  (
                    strings.icontains(.href_url.path, '/common/reprocess')
                    or strings.icontains(.href_url.query_params,
                                         "/common/reprocess"
                    )
                  )
                  and strings.icontains(.href_url.query_params, 'ctx=')
                  and strings.icontains(.href_url.query_params, 'sessionId=')
                )
              )
          )
  )
attack_types:
  - "Credential Phishing"
detection_methods:
  - "URL analysis"
id: "13a8c430-3e62-5c8f-86b5-3722599bead4"
