name: "Link: Credential theft via self-sent message with newly registered suspicious domain"
description: "Flags inbound messages where the sender and sole recipient are the same address, the message body is classified by NLU as credential theft with meaningful confidence, and at least one link resolves to a domain with a suspicious TLD that was registered less than 30 days ago."
type: "rule"
severity: "medium"
source: |
  type.inbound
  // self sender
  and length(recipients.to) == 1
  and sender.email.email == recipients.to[0].email.email
  and any(ml.nlu_classifier(body.current_thread.text).intents,
          .name == 'cred_theft' and .confidence != 'low'
  )
  and any(body.current_thread.links,
          ml.link_analysis(., mode="aggressive").effective_url.domain.tld in $suspicious_tlds
          and network.whois(ml.link_analysis(., mode="aggressive").effective_url.domain
          ).days_old < 30
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Natural Language Understanding"
  - "URL analysis"
  - "Whois"