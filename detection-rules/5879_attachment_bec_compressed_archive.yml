name: "PR# 5879 - Attachment: BEC content within compressed archive"
description: "Flags inbound messages carrying gzip attachments that, once expanded, contain an email file whose thread body text is classified by the NLU model as business email compromise with high confidence."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "gz"),
          any(file.expand_archives(.).files,
              any(ml.nlu_classifier(file.parse_eml(.).body.current_thread.text).intents,
                  .name == "bec" and .confidence == "high"
              )
          )
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Archive analysis"
  - "File analysis"
  - "Natural Language Understanding"
id: "4697505f-3f65-54da-9d58-3147fe0a31a2"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_markmsublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5879