name: "PR# 5637 - Attachment: PDF with Microsoft compensation lure"
description: "Identifies inbound messages containing PDF attachments that match a YARA signature associated with Microsoft-branded compensation lure."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches,
                  .name == "pdf_generic_msft_compensation_lure"
              )
          )
  )
attack_types:
  - "BEC/Fraud"
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "3689ef97-7437-5b7f-ad26-3f596b451712"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5637