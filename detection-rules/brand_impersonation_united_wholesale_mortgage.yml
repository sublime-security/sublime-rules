name: "Brand impersonation: United Wholesale Mortgage"
description: "Detects inbound messages displaying the sender name 'United Wholesale Mortgage' where the sending domain is not a legitimate UWM domain (uwm.com or loanadministration.com) or fails DMARC authentication, indicating spoofing of the brand."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and sender.display_name == 'United Wholesale Mortgage'
  and not (
    sender.email.domain.root_domain in ('uwm.com', 'loanadministration.com')
    and headers.auth_summary.dmarc.pass
  )
attack_types:
  - "BEC/Fraud"
  - "Credential Phishing"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "Spoofing"
detection_methods:
  - "Header analysis"
  - "Sender analysis"
id: "e128b4b8-00be-5f15-8cc7-0c09a93d665e"
