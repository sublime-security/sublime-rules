name: "PR# 5725 - Service abuse: Microsoft messaging with Cloudflare Turnstile-gated link"
description: "Detects inbound messages sent through Microsoft's messaging.microsoft.com infrastructure containing links that reference the recipient's own domain in the URL. These links route through a Cloudflare Turnstile challenge, a technique used to block automated security scanners while still delivering the final payload to human victims."
type: "rule"
severity: "high"
source: |
  type.inbound
  and sender.email.domain.domain == 'messaging.microsoft.com'
  and any(filter(body.current_thread.links, .href_url.scheme != 'mailto'),
          strings.contains(.href_url.url, recipients.to[0].email.domain.domain)
          and any([ml.link_analysis(., mode="aggressive")],
                  // CF Turnstile
                  any(.unique_urls_accessed,
                      .domain.domain == "challenges.cloudflare.com"
                  )
                  // or site is down behind Cloudflare
                  or (
                    regex.icontains(.final_dom.raw, 'error code 5\d{2}')
                    and regex.icontains(.final_dom.raw, 'cloudflare')
                  )
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Evasion"
  - "Social engineering"
detection_methods:
  - "URL analysis"
  - "Content analysis"
  - "Sender analysis"
