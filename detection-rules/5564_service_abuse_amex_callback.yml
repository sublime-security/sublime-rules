name: "Service Abuse: American Express callback scam"
description: "Messages spoofing American Express notification emails about a complimentary signs and supplies order, designed to lure recipients into calling a listed phone number. The rule parses the greeting line in the message body and runs it through a natural language classifier to confirm the content matches known callback scam intent patterns."
type: "rule"
severity: "high"
source: |
  type.inbound
  and sender.email.domain.root_domain == "americanexpress.com"
  and any(regex.iextract(body.current_thread.text, 'Hello, (?P<name>[^\n]+)\n'),
          any(ml.nlu_classifier(.named_groups['name']).intents,
              .name == "callback_scam"
          )
  )
attack_types:
  - "Callback Phishing"
tactics_and_techniques:
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "Natural Language Understanding"
  - "Content analysis"
  - "Sender analysis"
id: "786a8ab2-342b-5d06-acff-5dc1135290c3"
og_id: "c43f2cd1-216e-5391-b6e9-2b89c5ead1fc"
