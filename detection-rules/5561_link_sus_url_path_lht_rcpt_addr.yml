name: "PR# 5561 - Link: Observed URL path (lht) with recipient email address"
description: "This rule flags inbound messages where a link in the body contains the recipient's own email address appended to the URL path (e.g. after '/&lht='), a technique used to personalize or validate tracking links. The matched samples consistently use a fake missed voicecall/voicemail notification lure with obfuscated, zero-width characters in the subject line and spoofed sender domains, directing recipients to a credential-harvesting page tailored to their address."
type: "rule"
severity: "high"
source: |
  type.inbound
  and recipients.to[0].email.domain.valid
  and any(body.links,
          strings.iends_with(.href_url.path,
                             strings.concat('/&lht=',
                                            recipients.to[0].email.email
                             )
          )
  )
  
  
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
