name: "PR# 5339 - Body: Bid solicitation PDF lure"
description: "Detects inbound messages that greet the recipient with 'Dear Prospective Bidder,' and make use of a google hosted PDF icon as part of the lure."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and strings.contains(body.current_thread.text, "Dear Prospective Bidder,")
  and any(html.xpath(body.html,
                     '//table/tbody/tr/td/table//tr/td//table/tbody/tr/td'
          ).nodes,
          strings.ends_with(.display_text, ".pdf")
          and strings.contains(.raw,
                               "https://drive-thirdparty.googleusercontent.com/16/type/application/pdf"
          )
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "Content analysis"
  - "HTML analysis"
id: "833b58f6-556e-54bb-bfaf-24488029cbee"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5339