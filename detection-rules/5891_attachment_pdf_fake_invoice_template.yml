name: "PR# 5891 - Attachment: PDF fake invoice template"
description: "Detects inbound messages containing PDF attachments that match YARA signatures identifying fake invoice templates commonly used in financial fraud schemes."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_fake_invoice_template")
          )
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "File analysis"
  - "YARA"
id: "13bd21b3-a083-5b63-af2d-8f0f1d604de6"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5891