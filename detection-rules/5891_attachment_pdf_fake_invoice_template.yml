name: "Attachment: PDF fake invoice template"
description: "Detects inbound messages containing PDF attachments that match YARA signatures identifying fake invoice templates commonly used in financial fraud schemes."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_fake_invoice_template")
          )
  )
attack_types:
  - "BEC/Fraud"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "File analysis"
  - "YARA"
id: "13bd21b3-a083-5b63-af2d-8f0f1d604de6"
og_id: "a8f659bf-b37c-5e56-be8c-8db5f9594e7e"
