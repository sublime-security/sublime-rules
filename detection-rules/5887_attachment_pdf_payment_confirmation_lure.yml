name: "Attachment: PDF payment confirmation lure"
description: "Detects inbound messages containing a PDF attachment that matches YARA signatures identifying payment confirmation lure content."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name == "pdf_payment_confirmation_lure")
          )
  )
attack_types:
  - "BEC/Fraud"
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Social engineering"
detection_methods:
  - "File analysis"
  - "YARA"
id: "2f8329bf-3f57-5992-a79a-5aa74ea13d11"
og_id: "cb92189c-db72-5c9c-93f4-b21a09feaebc"
testing_pr: 5887
