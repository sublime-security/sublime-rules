name: "beta.DLP: US Bank Account Number"
description: "Detects messages containing US bank account numbers."
type: "dlp"
severity: "medium"
source: |
  type.outbound
  and (
    any(beta.ml_extract_sensitive_information(body.current_thread.text).elements,
        .type == "us_bank_account" and .confidence in ("medium", "high")
    )
    or any(beta.ml_extract_sensitive_information(subject.subject).elements,
           .type == "us_bank_account" and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(beta.ml_extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "us_bank_account"
                     and .confidence in ("medium", "high")
                 )
                 or any(beta.ml_extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "us_bank_account"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
tags:
  - "Financial data"
attack_types:
  - "DLP: PCI"
  - "DLP: Financial"
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "a72c2598-37fd-53d3-902f-3d49726f7fd2"
og_id: "b3db2bd1-c3b8-5954-8987-93757af5531b"
