name: "Headers: Malformed Outlook mailer string"
description: "Detects inbound messages where the mailer header claims to be Microsoft Outlook but does not conform to the expected build version format, indicating the header value has been spoofed or fabricated."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and strings.istarts_with(headers.mailer, "Microsoft Outlook, Build")
  and not regex.imatch(headers.mailer,
                       'Microsoft (?:Office )?Outlook, Build \d{1,2}\.0\.\d{4,5}'
  )
attack_types:
  - "Spam"
  - "Credential Phishing"
  - "BEC/Fraud"
tactics_and_techniques:
  - "Spoofing"
  - "Impersonation: Brand"
detection_methods:
  - "Header analysis"
id: "b3318772-815b-56b4-970b-4bb793f7a6f4"
