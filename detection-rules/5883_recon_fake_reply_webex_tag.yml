name: "PR# 5883 - Reconnaissance: Fake-reply lure with Webex subject tag"
description: "Detects inbound messages that masquerade as replies to an existing conversation (carrying an In-Reply-To header) despite having no actual prior thread history. The subjects reference scheduling calls, meetings, or follow-ups and end with a 'wbx' tag plus a random three-letter string, mimicking Webex meeting notifications. Senders vary widely, spanning free email providers and newly registered or lookalike domains, suggesting a mass-distributed social engineering tactic designed to appear as a continuation of a legitimate scheduling conversation."
type: "rule"
severity: "low"
source: |
  type.inbound
  and length(headers.in_reply_to) > 1
  and length(body.previous_threads) == 0
  and regex.imatch(subject.base, '.*-\swbx\s+[a-z]{3}\s*')
attack_types:
  - "BEC/Fraud"
  - "Spam"
  - "Reconnaissance"
tactics_and_techniques:
  - "Social engineering"
  - "Free email provider"
  - "Spoofing"
detection_methods:
  - "Header analysis"
  - "Content analysis"
