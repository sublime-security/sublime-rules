name: "Spam: VertiStream marketing tracking links"
description: "Detects VertiStream B2B content-syndication lead-gen messages: sponsor-branded content offers with tracking links and no attachments, sent from bulk-registered, tech-themed compound domains. Matches either the empty 'transactionid' div with a UUID id that VertiStream embeds in its mail, or VertiStream's tracking-link format on the sender's own domain (a numeric path with uid, prom_type and prom_id parameters)"
type: "rule"
severity: "medium"
source: |
  type.inbound
  // with links
  and length(filter(body.current_thread.links, .href_url.scheme != "mailto")) > 0
  and length(attachments) == 0
  and (
    (
      strings.icontains(body.html.raw, 'class="transactionid"')
      and any(html.xpath(body.html, "//div[@class='transactionid']").nodes,
              regex.imatch(.raw,
                           '<div class="transactionid" id="[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"></div>'
              )
      )
    )
    // or VertiStream's tracking-link format on the sender's own domain
    or any(body.current_thread.links,
           .href_url.domain.root_domain == sender.email.domain.root_domain
           and regex.imatch(.href_url.path, '/[0-9]+-[0-9]+/[0-9]+')
           and "uid" in keys(.href_url.query_params_decoded)
           and "prom_type" in keys(.href_url.query_params_decoded)
           and "prom_id" in keys(.href_url.query_params_decoded)
    )
  )
attack_types:
  - "Spam"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "HTML analysis"
  - "URL analysis"
  - "Sender analysis"
