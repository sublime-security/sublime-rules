name: "PR# 5112 - Spamhaus: Mail transiting an ASN-DROP listed network"
description: "Detects inbound mail whose Received-header IP path transits IP space announced by an autonomous system on the Spamhaus ASN-DROP list — ASNs Spamhaus assesses as controlled by, or knowingly providing service to, cybercriminals. This is Spamhaus attribution, not a Sublime observation. Ranges are resolved from the listed ASNs and refresh automatically; the Spamhaus copyright, list date, and terms URL are preserved in the rule source per Spamhaus's terms."
references:
  - "https://www.spamhaus.org/drop/asndrop.json"
  - "https://www.spamhaus.org/blocklists/do-not-route-or-peer/"
  - https://github.com/sublime-security/sublime-rules/pull/5112
