name: "Sender analysis: Sanctioned country domain"
description: "Flags inbound mail where the sender or return-path domain uses a top-level domain tied to a comprehensively embargoed or OFAC-sanctioned country (e.g., Cuba, Iran, North Korea, Syria, Russia, Belarus, and others), excluding known legitimate exceptions like corp.mail.ru and calendar.yandex.ru. The rule triggers when the sender has little or no established reputation—new or outlier prevalence without prior solicitation—or has a history of malicious or spam activity with no benign messages on record, indicating a high-risk, unverified source originating from a sanctioned jurisdiction."
type: "rule"
severity: "medium"
source: |
    type.inbound
    and (
      headers.return_path.domain.tld in~ (
        // Comprehensively embargoed
        "cu",
        "ir",
        "kp",
        "sy",
        // Russia / Belarus
        "ru",
        "su",
        "xn--p1ai",
        "by",
        // Other OFAC country-based programs
        "ve",
        "mm",
        "af",
        "ly",
        "ye",
        "sd",
        "ss",
        "so",
        "iq",
        "lb",
        "zw",
        "ni",
        "cf",
        "cd",
        "ml"
      )
      or sender.email.domain.tld in~ (
        "cu",
        "ir",
        "kp",
        "sy",
        "ru",
        "su",
        "xn--p1ai",
        "by",
        "ve",
        "mm",
        "af",
        "ly",
        "ye",
        "sd",
        "ss",
        "so",
        "iq",
        "lb",
        "zw",
        "ni",
        "cf",
        "cd",
        "ml"
      )
    )
    and sender.email.domain.domain not in~ ("corp.mail.ru", "calendar.yandex.ru")
    and (
      (
        profile.by_sender().prevalence in ("new", "outlier")
        and not profile.by_sender().solicited
      )
      or (
        profile.by_sender().any_messages_malicious_or_spam
        and not profile.by_sender().any_messages_benign
      )
    )
    and not profile.by_sender().any_messages_benign
tags:
  - "Attack surface reduction"
attack_types:
  - "Spam"
  - "BEC/Fraud"
tactics_and_techniques:
  - "Evasion"
detection_methods:
  - "Header analysis"
  - "Sender analysis"
  - "Threat intelligence"
