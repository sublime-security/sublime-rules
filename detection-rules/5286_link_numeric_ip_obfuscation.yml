name: "PR# 5286 - Link: Numeric IP obfuscation in URL"
description: "Detects inbound messages containing links where the host is a numeric-only IP representation, commonly used to bypass domain-based URL filtering."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          .href_url.scheme == "http"
          and any(.href_url.ip.translation.encoders,
                  . in ('octal', 'decimal_integer')
          )
  )
attack_types:
  - "Credential Phishing"
  - "Malware/Ransomware"
tactics_and_techniques:
  - "Evasion"
detection_methods:
  - "URL analysis"
id: "0266fe41-fe55-5951-aef4-de39bc1e0f15"
tags:
