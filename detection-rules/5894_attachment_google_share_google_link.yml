name: "Attachment: Google share.google URL shortener in undocumented redirect forms"
description: "Detects inbound messages whose attachments contain links in either of two undocumented Google share.google redirect forms: google.<tld>/share.google?q=<code>, and share.google/?link=<url>. Both inherit Google domain reputation to mask an attacker-controlled destination. Google publishes the share.google shortener as a share.google/<code> path, but neither the on-Google-domain ‘q’ form nor the ‘link’ parameter form is documented. ICS calendar attachments are covered by a separate rule."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(attachments,
          not (
            .file_type == "ics"
            or .file_extension == "ics"
            or .content_type in ("application/ics", "text/calendar")
          )
          and any(file.explode(.),
                  any(.scan.url.urls,
                      (
                        .domain.sld == "google"
                        and strings.istarts_with(.path, '/share.google')
                        and 'q' in keys(.query_params_decoded)
                      )
                      or (
                        .domain.root_domain == "share.google"
                        and any(["link", "_task", "_mbox", "_mimeclass"],
                                . in keys(..query_params_decoded)
                        )
                      )
                  )
          )
  )
attack_types:
  - "Spam"
  - "Credential Phishing"
tactics_and_techniques:
  - "Open redirect"
  - "Social engineering"
detection_methods:
  - "URL analysis"
  - "Content analysis"
  - "File analysis"
related_detections:
  - "link_google_share_google.yml"
  - "attachment_ics_google_share_google_link.yml"
