name: "PR# 5333 - Link: Google share.google URL shortener in google.<tld>/share.google path form"
description: "Detects inbound messages abusing Google's share.google URL shortener in its Google-domain-hosted path form: links shaped like google.<tld>/share.google?q=<code>, where the host is any Google top-level domain (google.com, google.fr, google.de, google.co.uk, and other ccTLDs) and the code is a per-share alphanumeric string — as opposed to the more familiar share.google/<code> short link on the standalone share.google domain. Because this form is served from a google.<tld> domain itself, it inherits Google's domain reputation and is frequently allow-listed, letting attackers mask attacker-controlled destinations behind a maximally trusted domain. This google.<tld>/share.google?q= path form is undocumented: Google publishes the share.google shortener feature, but not this on-Google-domain form or its 'q' parameter, and its inconsistent HEAD-versus-GET responses frustrate automated destination checks. The rule matches across Google's ccTLDs rather than google.com alone, and inspects links in the message body, links inside exploded attachments, and links within ICS calendar invites. Observed lures include fake photo-sharing notifications, dating/adult content teasers, and generic 'message received' hooks designed to entice clicks."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and (
    // within body.links
    any(body.links,
        .href_url.domain.sld == "google"
        and strings.istarts_with(.href_url.path, '/share.google')
        and 'q' in keys(.href_url.query_params_decoded)
    )
    // within attachments
    or any(attachments,
           // file explode for non ICS
           (
             not (
               .file_type == "ics"
               or .file_extension == "ics"
               or .content_type in ("application/ics", "text/calendar")
             )
             and any(file.explode(.),
                     any(.scan.url.urls,
                         .domain.sld == "google"
                         and strings.istarts_with(.path, '/share.google')
                         and 'q' in keys(.query_params_decoded)
                     )
             )
           )
           // use parse_ics for ics eents
           or (
             (
               .file_type == "ics"
               or .file_extension == "ics"
               or .content_type in ("application/ics", "text/calendar")
             )
             and any(beta.file.parse_ics(.).events,
                     any(.links,
                         .href_url.domain.sld == "google"
                         and strings.istarts_with(.href_url.path, '/share.google')
                         and 'q' in keys(.href_url.query_params_decoded)
                     )
             )
           )
    )
  )
