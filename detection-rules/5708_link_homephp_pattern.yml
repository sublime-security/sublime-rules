name: "Link: home.php affiliate tracking token"
description: "Detects links carrying a known affiliate tracking token pattern. Observed in health, reward and account suspension spam."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          (
            strings.iends_with(.href_url.path, '.home.php')
            and all(["sq", "lk"], . in keys(..href_url.query_params_decoded))
          )
          or (
            strings.icontains(.href_url.fragment, '.home.php?sq=')
            and strings.icontains(.href_url.fragment, '&lk')
          )
  )
attack_types:
  - "Spam"
tactics_and_techniques:
  - "Free file host"
  - "Evasion"
detection_methods:
  - "URL analysis"
id: "95328835-047c-51ff-bf04-10aac37e65cd"
