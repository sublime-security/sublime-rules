name: "Attachment: PDF blue OneDrive lure"
description: "This rule detects inbound emails containing PDF attachments that match a YARA signature identifying a blue-themed OneDrive lure."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              any(.scan.yara.matches, .name in ("pdf_blue_oneDrive_lure_2"))
          )
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "PDF"
  - "Impersonation: Brand"
  - "Social engineering"
detection_methods:
  - "YARA"
  - "File analysis"
id: "5ab13796-b05d-5150-ad73-928bebe57576"
og_id: "e408e847-8364-5e4e-ba8b-a11ae846085e"
