name: "Link: Trac-link URL with JWT encoding"
description: "Detects messages containing links to trac-link.com, in either the body or PDF attachments, with JWT encoded url paths."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and (
    // body links
    (
      any(body.links,
          .href_url.domain.root_domain == "trac-link.com"
          and strings.istarts_with(.href_url.path, '/api/mail-track/link/')
      )
      and not strings.icontains(body.html.raw,
                                'https://storage.googleapis.com/easymails'
      )
    )
  
    // attachment links
    or any(attachments,
           (.file_extension == "pdf" or .file_type == "pdf")
           and any(file.explode(.),
                   any(.scan.pdf.urls, .domain.root_domain == "trac-link.com")
           )
    )
  )
  
  // negate legitimate replies
  and not (
    (length(headers.references) > 0 or headers.in_reply_to is not null)
    and (subject.is_forward or subject.is_reply)
    and length(body.previous_threads) >= 1
  )
  
  // negate legitimate replies
  and not (
    (length(headers.references) > 0 or headers.in_reply_to is not null)
    and (subject.is_forward or subject.is_reply)
    and length(body.previous_threads) >= 1
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Open redirect"
  - "Evasion"
  - "PDF"
detection_methods:
  - "URL analysis"
  - "File analysis"
  - "Content analysis"
