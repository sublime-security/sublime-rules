name: "PR# 5809 - Attachment: PDF object hash for callback phishing lures"
description: "Detects inbound messages containing PDF attachments that matches an object hash associated with call back phishing messages."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(filter(attachments, .file_type == "pdf"),
          any(file.explode(.),
              .scan.pdf_obj_hash.object_hash == "859af9926b356dd9b9df3b2c59a7bd16"
          )
  )
attack_types:
  - "Callback Phishing"
tactics_and_techniques:
  - "PDF"
detection_methods:
  - "File analysis"
id: "70edd50a-5a63-5786-8f6e-849ef3955ffb"
tags:
  - created_from_open_prs
  - rule_status_added
  - pr_author_keaton-sublime
references:
  - https://github.com/sublime-security/sublime-rules/pull/5809