name: "Spam: VertiStream/SenderTeam marketing messages with transaction ID artifact"
description: "Detects B2B content-syndication lead-gen messages from VertiStream and its sister sending identity SenderTeam: inbound mail with links and no attachments that contains an empty HTML div with a 'transactionid' class and a UUID id. Both embed this element in their sponsor-branded content offers, sent from bulk-registered, tech-themed compound domains. The same element appears in VertiStream's linkless warm-up messages."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and length(filter(body.current_thread.links, .href_url.scheme != "mailto")) > 0
  and length(attachments) == 0
  and strings.icontains(body.html.raw, 'class="transactionid"')
  // verify the extracted div exactly: empty, with a uuid id
  and any(html.xpath(body.html, "//div[@class='transactionid']").nodes,
          regex.imatch(.raw,
                       '<div class="transactionid" id="[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"></div>'
          )
  )
attack_types:
  - "Spam"
tactics_and_techniques:
  - "Social engineering"
detection_methods:
  - "HTML analysis"
id: "9b1287f6-2c72-5e39-b09d-24b2b48eb387"
