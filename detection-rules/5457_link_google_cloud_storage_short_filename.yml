name: "PR# 5457 - Link: Google Cloud Storage short filename pattern"
description: "Detects inbound emails containing links to storage.googleapis.com where the URL path matches a suspicious pattern of a single-character folder followed by a one or two letter HTML filename (e.g., /x/ab.html). This naming convention is commonly used by phishing kits hosted on legitimate cloud storage to evade detection and obscure the true destination of the link."
type: "rule"
severity: "medium"
source: |
  type.inbound
  and any(body.links,
          .href_url.domain.domain == "storage.googleapis.com"
          and regex.imatch(.href_url.path, '/[^/]+/[a-z]{1,2}\.html')
  )
attack_types:
  - "Credential Phishing"
tactics_and_techniques:
  - "Free file host"
  - "Evasion"
detection_methods:
  - "URL analysis"
id: "68bc5664-ae23-57e1-b158-28bd431d2707"
tags:
  - created_from_open_prs
