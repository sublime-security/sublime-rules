name: "beta.DLP: MSIP Sensitivity Label - Outbound"
description: |
  Detects outbound emails carrying a Microsoft Information Protection (MSIP/Purview)
  sensitivity label in the headers. Presence of this label indicates the sending
  organization has classified the content as sensitive or confidential.
type: rule
authors:
  - twitter: sublime_security
source: |
  type.outbound
  and (
    any(headers.hops,
        any(.fields,
            .name =~ "msip_labels"
            and (
              strings.icontains(.value, "Confidential", "Restricted", "Secret")
            )
        )
    )
    or any(headers.hops,
           any(.fields,
               .name =~ "sensitivity"
               and (strings.icontains(.value, "Confidential", "Restricted"))
           )
    )
  )
tags:
  - "DLP"
  - "Confidential"
  - "MSIP"
  - "Data exfiltration"
id: "6880c43f-51e2-5a53-8768-6b538e271540"
