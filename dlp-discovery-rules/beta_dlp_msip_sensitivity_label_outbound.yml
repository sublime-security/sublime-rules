name: beta.DLP: MSIP Sensitivity Label - Outbound
description: |
  Detects outbound emails carrying a Microsoft Information Protection (MSIP/Purview)
  sensitivity label in the headers. Presence of this label indicates the sending
  organization has classified the content as sensitive or confidential.
type: rule
authors:
  - twitter: sublime_security
source: |
  type.outbound
  and (
    any(headers.hops,
        any(.fields,
            strings.ilike(.name, "msip_labels")
            and (
                strings.icontains(.value, "Confidential")
                or strings.icontains(.value, "Highly Confidential")
                or strings.icontains(.value, "Restricted")
                or strings.icontains(.value, "Secret")
            )
        )
    )
    or any(headers.hops,
        any(.fields,
            strings.ilike(.name, "sensitivity")
            and (
                strings.icontains(.value, "Confidential")
                or strings.icontains(.value, "Restricted")
            )
        )
    )
  )
tags:
  - "DLP"
  - "Confidential"
  - "MSIP"
  - "Data exfiltration"
