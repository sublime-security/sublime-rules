name: "DLP: Ireland Driver's License"
type: "dlp"
severity: "high"
source: |
  // NOTE: This rule depends on the ie_driver_license recognizer in Hydra — do not ship until recognizer is merged
  // Ireland driver number: 9 digits (field 4d on plastic card). Field 5 format unknown.
  // Do NOT use Purview's "6 digits + 4 letters" — contradicted by NDLS.
  type.outbound
  and (
    any(beta.ml_extract_sensitive_information(body.current_thread.text).elements,
        .type == "ie_driver_license" and .confidence in ("medium", "high")
    )
    or any(beta.ml_extract_sensitive_information(subject.subject).elements,
           .type == "ie_driver_license" and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               any(beta.ml_extract_sensitive_information(.scan.strings.raw).elements,
                   .type == "ie_driver_license"
                   and .confidence in ("medium", "high")
               )
               or any(beta.ml_extract_sensitive_information(.scan.ocr.raw).elements,
                      .type == "ie_driver_license"
                      and .confidence in ("medium", "high")
               )
           )
    )
  )
attack_types:
  - "DLP: Personal Data"
tags:
  - "Personal data"
  - "GDPR"
  - "Ireland"
id: "8946d1c2-e0da-577b-b481-391e1ca936a6"
