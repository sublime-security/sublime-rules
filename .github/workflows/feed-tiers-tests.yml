name: Feed tier scripts tests

on:
  pull_request:
    paths:
      - ".github/scripts/feed_tiers/**"
      - ".github/workflows/sync-public.yml"
      - ".github/workflows/promote-delayed.yml"
      - ".github/workflows/tier-check.yml"
      - ".github/workflows/feed-tiers-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .github/scripts/feed_tiers
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -n auto
