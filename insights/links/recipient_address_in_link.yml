name: "Recipient email in link"
type: "query"
source: |
  distinct(map(filter(body.links,
                      any(recipients.to, .email.domain.valid)
                      and any(recipients.to,
                              strings.icontains(..href_url.url, .email.email)
                      )
               ),
               .href_url.url
           ),
           .
  )
severity: "low"
tags:
  - "Suspicious link"
