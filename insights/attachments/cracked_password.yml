name: "Cracked attachment password"
type: "query"
source: |
  flatten(
      map(attachments, [
          map(filter(file.explode(.),
                     .scan.encrypted_pdf.cracked_password is not null
              ),
              .scan.encrypted_pdf.cracked_password
          ),
          map(filter(file.explode(.),
                     .scan.encrypted_zip.cracked_password is not null
              ),
              .scan.encrypted_zip.cracked_password
          ),
          map(filter(file.explode(.),
                     .scan.encrypted_doc.cracked_password is not null
              ),
              .scan.encrypted_doc.cracked_password
          )
      ])
  )
severity: "informational"
