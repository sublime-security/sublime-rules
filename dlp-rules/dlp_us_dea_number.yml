name: "DLP: DEA Number"
description: "Detects messages containing US Drug Enforcement Administration (DEA) numbers."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: HIPAA"
  - "DLP: Healthcare Data"
data_categories:
  - "DLP: HIPAA"
  - "DLP: Healthcare Data"
tags:
  - "Healthcare Data"
  - "HIPAA"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "us_dea_number" and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "us_dea_number" and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "us_dea_number"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "us_dea_number"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "9370c178-cc2b-5a07-8dbb-3cb5da12f876"
