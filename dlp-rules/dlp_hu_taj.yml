name: "DLP: Hungary TAJ"
description: "Detects messages containing Hungarian social security (TAJ) numbers."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: Healthcare Data"
data_categories:
  - "DLP: Healthcare Data"
tags:
  - "Healthcare Data"
  - "GDPR"
  - "Hungary"
  - "EU"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "hu_social_security_number" and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "hu_social_security_number"
           and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "hu_social_security_number"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "hu_social_security_number"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "12df6082-fdf4-5dd0-89dc-4fbee95ac259"
