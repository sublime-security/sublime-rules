name: "DLP: ICD-9 Code"
description: "Detects messages containing ICD-9 medical diagnosis codes."
type: "dlp"
severity: "high"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "us_icd9" and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "us_icd9" and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "us_icd9" and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "us_icd9" and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
tags:
  - "Healthcare Data"
attack_types:
  - "DLP: HIPAA"
  - "DLP: Healthcare Data"
data_categories:
  - "DLP: HIPAA"
  - "DLP: Healthcare Data"
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "05c8a77c-ebc2-5caa-8b65-81598ca39e4a"
