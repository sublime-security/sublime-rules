name: "DLP: Canada Bank Account"
description: "Detects messages containing Canadian bank account numbers."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: Financial Data"
data_categories:
  - "DLP: Financial Data"
tags:
  - "Financial Data"
  - "PIPEDA"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "ca_bank_account" and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "ca_bank_account" and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "ca_bank_account"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "ca_bank_account"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "82e28910-ba5f-5009-9cd1-0322b88c73ae"
