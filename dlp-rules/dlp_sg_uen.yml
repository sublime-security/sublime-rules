name: "DLP: Singapore UEN"
description: "Detects messages containing Singapore Unique Entity Numbers (UEN)."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: Financial Data"
data_categories:
  - "DLP: Financial Data"
tags:
  - "Financial Data"
  - "PDPA"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "sg_unique_entity_number" and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "sg_unique_entity_number"
           and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "sg_unique_entity_number"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "sg_unique_entity_number"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "12c81353-4ff0-5919-be16-5aa5b0777838"
