name: "DLP: Finland European Health Insurance"
description: "Detects messages containing Finnish European Health Insurance card numbers."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: Healthcare Data"
data_categories:
  - "DLP: Healthcare Data"
tags:
  - "Healthcare Data"
  - "GDPR"
  - "Finland"
  - "EU"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "fi_european_health_insurance_number"
        and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "fi_european_health_insurance_number"
           and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "fi_european_health_insurance_number"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "fi_european_health_insurance_number"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "a3015530-20fd-5ec4-93e0-b705706d155a"
