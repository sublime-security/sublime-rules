name: "DLP: Austria VAT"
description: "Detects messages containing Austrian VAT numbers."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: Financial Data"
data_categories:
  - "DLP: Financial Data"
tags:
  - "Financial Data"
  - "GDPR"
  - "Austria"
  - "EU"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "at_vat" and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "at_vat" and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "at_vat" and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "at_vat" and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "77d8ebd4-042a-5bdc-9837-d3c8c6e122ef"
