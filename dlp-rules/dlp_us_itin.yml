name: "DLP: US Individual Taxpayer Identification Number (ITIN)"
description: "Detects messages containing US Individual Taxpayer Identification Numbers."
type: "dlp"
severity: "high"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "us_individual_taxpayer_identification_number"
        and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "us_individual_taxpayer_identification_number"
           and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "us_individual_taxpayer_identification_number"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "us_individual_taxpayer_identification_number"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
tags:
  - "PII"
  - "Personal Data"
attack_types:
  - "DLP: PII"
  - "DLP: Personal Data"
data_categories:
  - "DLP: PII"
  - "DLP: Personal Data"
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "bca7cee0-2ee2-548d-b40f-16da1218d3a7"
