name: "DLP: France Bank Account"
description: "Detects messages containing French bank account numbers."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: Financial Data"
data_categories:
  - "DLP: Financial Data"
tags:
  - "Financial Data"
  - "GDPR"
  - "France"
  - "EU"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "fr_bank_account" and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "fr_bank_account" and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "fr_bank_account"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "fr_bank_account"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "f960d725-44ad-5952-a556-32550f70344f"
