name: "DLP: France National ID (CNI)"
description: "Detects messages containing French national identity card numbers (CNI)."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: Personal Data"
data_categories:
  - "DLP: Personal Data"
tags:
  - "Personal Data"
  - "GDPR"
  - "France"
  - "EU"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "fr_identity_card_number" and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "fr_identity_card_number"
           and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "fr_identity_card_number"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "fr_identity_card_number"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "4f395680-183e-5006-a0c3-fa58dd4dec1e"
