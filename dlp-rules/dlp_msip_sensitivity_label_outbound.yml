name: "beta.DLP: MSIP Sensitivity Label - Outbound"
description: |
  Detects outbound emails with an active Microsoft Information Protection
  (MSIP/Purview) sensitivity label named Confidential, Highly Confidential,
  Restricted, or Secret.
type: rule
authors:
  - twitter: sublime_security
source: |
  type.outbound
  and headers.sensitivity_label.provider == "microsoft"
  and headers.sensitivity_label.name in~ (
    "Confidential",
    "Highly Confidential",
    "Restricted",
    "Secret"
  )
tags:
  - "DLP"
  - "Confidential"
  - "MSIP"
  - "Data exfiltration"
id: "6880c43f-51e2-5a53-8768-6b538e271540"
