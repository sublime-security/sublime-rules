name: "DLP: US Medicare Beneficiary ID"
description: "Detects messages containing US Medicare Beneficiary Identification numbers."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: HIPAA"
  - "DLP: Healthcare Data"
data_categories:
  - "DLP: HIPAA"
  - "DLP: Healthcare Data"
tags:
  - "Healthcare Data"
  - "HIPAA"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "us_medicare_beneficiary_identifier"
        and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "us_medicare_beneficiary_identifier"
           and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "us_medicare_beneficiary_identifier"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "us_medicare_beneficiary_identifier"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "318b082e-2c16-5f6c-bf34-0298b5411538"
