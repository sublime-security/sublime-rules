name: "DLP: Canada Driver's License"
description: "Detects messages containing Canadian driver's license numbers."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: Personal Data"
data_categories:
  - "DLP: Personal Data"
tags:
  - "Personal Data"
  - "PIPEDA"
  - "Canada"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "ca_driver_license" and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "ca_driver_license" and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "ca_driver_license"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "ca_driver_license"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "10ca6e78-58e3-53d2-8193-8bdf4a9f6fbe"
