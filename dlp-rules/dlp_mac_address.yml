name: "DLP: MAC Address"
description: "Detects messages containing MAC addresses."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: Network Data"
data_categories:
  - "DLP: Network Data"
tags:
  - "Network"
  - "Infrastructure"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "mac_address" and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "mac_address" and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "mac_address" and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "mac_address"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "3c73ace9-a31f-52d3-a1f2-031d27d5c981"
