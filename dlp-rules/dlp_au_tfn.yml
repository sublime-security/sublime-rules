name: "DLP: Australia Tax File Number"
description: "Detects messages containing Australian Tax File Numbers (TFN)."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: Personal Data"
data_categories:
  - "DLP: Personal Data"
tags:
  - "Personal Data"
  - "AU Privacy Act"
  - "Australia"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "au_tax_file_number" and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "au_tax_file_number" and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "au_tax_file_number"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "au_tax_file_number"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "5dab7200-9a67-50d1-8a54-90c96bb15810"
