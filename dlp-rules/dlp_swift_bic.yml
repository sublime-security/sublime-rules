name: "DLP: SWIFT/BIC Code"
description: "Detects outbound messages containing SWIFT/BIC codes. SWIFT codes are used to identify banks and financial institutions globally and may indicate financial account details being shared externally."
type: "dlp"
severity: "high"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "swift_bic" and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "swift_bic" and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "swift_bic" and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "swift_bic" and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
tags:
  - "Financial Data"
  - "PCI DSS"
attack_types:
  - "DLP: Financial Data"
data_categories:
  - "DLP: Financial Data"
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "9fea1ec4-620e-52c0-a6fc-b1fd08165735"
