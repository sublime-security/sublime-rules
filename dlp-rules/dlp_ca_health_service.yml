name: "DLP: Canada Health Service Number"
description: "Detects messages containing Canadian health service numbers."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: Healthcare Data"
data_categories:
  - "DLP: Healthcare Data"
tags:
  - "Healthcare Data"
  - "PIPEDA"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "ca_health_service_number" and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "ca_health_service_number"
           and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "ca_health_service_number"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "ca_health_service_number"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "faf07fa0-879c-58ce-b872-cb62b68ea7ce"
