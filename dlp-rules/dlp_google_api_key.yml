name: "DLP: Google / GCP API Key"
description: "Detects messages containing Google or GCP API keys."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: Secrets & Credentials"
data_categories:
  - "DLP: Secrets & Credentials"
tags:
  - "Secrets"
  - "Credentials"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "google_api_key" and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "google_api_key" and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "google_api_key"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "google_api_key"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "eb663df5-db13-5157-938c-32e4b0ee2830"
