name: "DLP: Vehicle VIN"
description: "Detects messages containing Vehicle Identification Numbers (VIN)."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: Asset Exposure"
data_categories:
  - "DLP: Asset Exposure"
tags:
  - "Asset"
  - "VIN"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "vehicle_identification_number"
        and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "vehicle_identification_number"
           and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "vehicle_identification_number"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "vehicle_identification_number"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "967bdc0d-1515-5dbb-bcca-4b225c2f277f"
