name: "DLP: Luxembourg Non-Natural ID"
description: "Detects messages containing Luxembourg non-natural person identification numbers."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: Financial Data"
data_categories:
  - "DLP: Financial Data"
tags:
  - "Financial Data"
  - "GDPR"
  - "Luxembourg"
  - "EU"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "lu_legal_entity_identification_number"
        and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "lu_legal_entity_identification_number"
           and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "lu_legal_entity_identification_number"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "lu_legal_entity_identification_number"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "a309ea98-634c-5525-ae60-4dea84d3e6dc"
