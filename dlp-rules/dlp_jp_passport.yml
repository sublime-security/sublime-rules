name: "DLP: Japan Passport Number"
description: "Detects messages containing Japanese passport numbers."
type: "dlp"
severity: "high"
attack_types:
  - "DLP: Personal Data"
data_categories:
  - "DLP: Personal Data"
tags:
  - "Personal Data"
  - "APPI"
  - "Japan"
source: |
  type.outbound
  and (
    any(ml.extract_sensitive_information(body.current_thread.text).elements,
        .type == "jp_passport_number" and .confidence in ("medium", "high")
    )
    or any(ml.extract_sensitive_information(subject.subject).elements,
           .type == "jp_passport_number" and .confidence in ("medium", "high")
    )
    or any(attachments,
           any(file.explode(.),
               (
                 any(ml.extract_sensitive_information(.scan.strings.raw).elements,
                     .type == "jp_passport_number"
                     and .confidence in ("medium", "high")
                 )
                 or any(ml.extract_sensitive_information(.scan.ocr.raw).elements,
                        .type == "jp_passport_number"
                        and .confidence in ("medium", "high")
                 )
               )
           )
    )
  )
detection_methods:
  - "Content analysis"
  - "Natural Language Understanding"
  - "File analysis"
  - "Optical Character Recognition"
id: "3e1a1332-7dbd-50c0-8b5e-00a891466067"
